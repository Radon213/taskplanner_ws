id: thyroidectomy_doctor_prompt_v1

procedure:
  id: "thyroidectomy"
  name: "Open Thyroidectomy"
  ko: "갑상선절제술"
  scope: "physician-document partial scenario"

phase_labels:
  normal:
    P01: "Skin incision"
    P02: "Skin flap elevation"
    P03: "Strap muscle Exposure"
    P04: "thyroid Exposure"
    P05: "Thyroid vessels ligation"
  interrupt:
    P06: "Bleeding/Hemostasis interrupt"

phase_labels_ko:
  normal:
    P01: "피부 절개"
    P02: "피부판 거상"
    P03: "띠근 노출"
    P04: "갑상선 노출"
    P05: "갑상선 혈관 결찰"
  interrupt:
    P06: "출혈/지혈 인터럽트"

tools:
  T01: "#15 Scalpel"
  T02: "Adson forceps"
  T03: "Allis clamp forceps"
  T04: "Bovie surgical cautery"
  T05: "army navy retractor"
  T06: "Senn miller retractor"
  T07: "Bipolar cautery"
  T08: "Mosquito forceps"
  T09: "Harmonics shears"
  T10: "Yankeur suction"

bed_robot_arm_groups:
  direction_enum: [UP, DOWN, LEFT, RIGHT, LEFT_RIGHT, UP_DOWN]
  distance_policy:
    precedence: [explicit_with_unit, explicit_unit_inferred, qualitative_inferred, defaulted]
    default_distance_mm: 10
    qualitative_min_mm: 1
    qualitative_max_mm: 30
    cm_to_mm_multiplier: 10
    unitless_numeric_unit: mm
    clamp_explicit_values: false
    qualitative_integer_mm: true
    distance_origins: [explicit_with_unit, explicit_unit_inferred, qualitative_inferred, defaulted]
    qualitative_anchors:
      "아주 살짝": 1
      "미세하게": 1
      "살짝": 5
      "조금": 10
      "조금 더": 10
      "많이": 20
      "아주 많이": 30
      "최대한": 30
  groups:
    suction:
      enabled: true
      initial_end_effector_profile: suction
      allowed_operations: [suction_start, suction_stop, change_end_effector]
    retraction:
      enabled: true
      initial_end_effector_profile: thyroid_retractor
      allowed_operations: [retraction, release_retraction, change_end_effector]
  cues:
    - id: start_suction_for_incision
      phase_id: P01
      group_id: suction
      operation: suction_start
      utterances: ["석션", "석션 시작", "석션 주세요"]
      directions: []
      default_distance_mm: 0
      end_effector_profile: suction
      feedback_text: "석션을 시작합니다."
    - id: start_suction_for_thyroid_exposure
      phase_id: P04
      group_id: suction
      operation: suction_start
      utterances: ["석션", "석션 줘", "석션 주세요"]
      directions: []
      default_distance_mm: 0
      end_effector_profile: suction
      feedback_text: "석션을 시작합니다."
    - id: stop_suction_for_thyroid_exposure
      phase_id: P04
      group_id: suction
      operation: suction_stop
      utterances: ["석션 빼", "석션 빠져", "석션 스탑"]
      directions: []
      default_distance_mm: 0
      end_effector_profile: suction
      feedback_text: "석션을 정지합니다."
    - id: thyroid_exposure_adjustment
      phase_id: P04
      group_id: retraction
      operation: retraction
      utterances:
        - "리트랙터를 위로 조금 당겨줘"
        - "리트랙터를 아래로 살짝 당겨줘"
        - "리트랙터를 왼쪽으로 10 더 당겨줘"
        - "리트랙터를 오른쪽으로 1센치 당겨줘"
        - "리트랙터를 좌우 동시에 조금 당겨줘"
        - "리트랙터를 상하 동시에 조금 당겨줘"
      directions: [UP, DOWN, LEFT, RIGHT, LEFT_RIGHT, UP_DOWN]
      default_distance_mm: 10
      end_effector_profile: thyroid_retractor
      feedback_text: "갑상선 노출을 위한 견인 위치를 조정합니다."
    - id: army_exposure_after_exchange
      phase_id: P04
      group_id: retraction
      operation: retraction
      utterances:
        - "아미를 위로 조금 당겨줘"
        - "아미를 아래로 살짝 당겨줘"
        - "아미를 왼쪽으로 10 더 당겨줘"
        - "아미를 오른쪽으로 1센치 당겨줘"
        - "아미를 좌우 동시에 조금 당겨줘"
        - "아미를 상하 동시에 조금 더 당겨줘"
      directions: [UP, DOWN, LEFT, RIGHT, LEFT_RIGHT, UP_DOWN]
      default_distance_mm: 10
      end_effector_profile: army
      feedback_text: "아미 리트랙터로 견인을 재개하고 위치를 조정합니다."
  end_effector_transitions:
    - id: thyroid_retractor_to_army
      phase_id: P04
      group_id: retraction
      from_profile: thyroid_retractor
      to_profile: army
      utterances: ["아미", "아미 줘", "아미 주세요"]
      feedback_text: "아미 리트랙터용 엔드이펙터로 교환합니다."

phase_flow:
  normal_sequence:
    - from: "P01"
      to: "P02"
      transition_cues:
        anatomy: "skin flap/skin edge is ready to be lifted"
        action: "Allis clamp grasps or elevates skin flap"
        tool_cue: "T03 appears after T01/T04 incision work"

    - from: "P02"
      to: "P03"
      transition_cues:
        anatomy: "strap muscle begins to appear under elevated flap"
        action: "flap elevation is mostly complete; dissection approaches midline strap muscle"
        tool_cue: "T05/T06 maintain flap exposure while T02/T04 works deeper"

    - from: "P03"
      to: "P04"
      transition_cues:
        anatomy: "thyroid region appears after strap muscle exposure/division"
        action: "strap muscle is retracted up/down/left/right"
        tool_cue: "T05 or T06 changes traction direction"

    - from: "P04"
      to: "P05"
      transition_cues:
        anatomy: "superior pole or thyroid vessels become visible"
        action: "small vessel/pedicle is isolated"
        tool_cue: "T02 or T08 works near vessel before T09 request"

  interrupt_transition:
    phase: "P06"
    enter_when:
      visual: "blood, smoke, or fluid obscures the operative field"
      action: "surgeon pauses dissection to clear field or control bleeding"
      tool_cue: "T10, T07, or T04 is requested for visibility/hemostasis"
    exit_when:
      visual: "field is clear and active bleeding is controlled"
      return_to: "previous_normal_phase"

phase_details:
  P01:
    visual_cues:
      - "neck skin incision"
      - "skin/subcutaneous fat visible"
      - "T01 or T04 at incision line"
    expected_tool_sequence:
      - current: "T01"
        next: "T04"
        cue: "skin incision complete; subcutaneous dissection starts"
      - current: "T04"
        next: "T03"
        cue: "skin edge/flap ready to grasp"

  P02:
    visual_cues:
      - "T03 holds skin flap"
      - "T05/T06 maintains superficial exposure"
      - "connective tissue under flap divided"
    expected_tool_sequence:
      - current: "T03"
        next: "T05"
        cue: "flap needs counter-traction"
      - current: "T05"
        next: "T06"
        cue: "more superficial exposure needed"
      - current: "T06"
        next: "T02"
        cue: "fine tissue handling begins"
      - current: "T02"
        next: "T04"
        cue: "tissue tensioned for dissection"

  P03:
    visual_cues:
      - "strap muscle visible"
      - "midline strap muscle exposure/division"
      - "T05 holds skin flap"
    expected_tool_sequence:
      - current: "T05"
        next: "T02"
        cue: "fine grasping before division"
      - current: "T02"
        next: "T04"
        cue: "strap/midline tissue tensioned"

  P04:
    visual_cues:
      - "thyroid exposed"
      - "strap muscle retracted up/down/left/right"
      - "fine dissection around thyroid"
    expected_tool_sequence:
      - current: "T05"
        next: "T06"
        cue: "focused thyroid exposure needed"
      - current: "T06"
        next: "T02"
        cue: "fine handling around thyroid"
      - current: "T02"
        next: "T08"
        cue: "small tissue/vessel pedicle needs grasping"
      - current: "T08"
        next: "T07"
        cue: "minor bleeding or precise coagulation"

  P05:
    visual_cues:
      - "superior pole/vessels visible"
      - "vessel pedicle isolated"
      - "T02 or T08 near vessel"
    expected_tool_sequence:
      - current: "T02"
        next: "T08"
        cue: "vessel/pedicle needs clamping"
      - current: "T08"
        next: "T09"
        cue: "pedicle isolated; ready for ligation"
      - current: "T09"
        next: "T07"
        cue: "post-ligation bleeding/coagulation"

  P06:
    visual_cues:
      - "blood, smoke, or fluid reduces field visibility"
      - "active dissection pauses"
      - "surgeon focuses on clearing or coagulating"
    expected_tool_sequence:
      - current: "any"
        next: "T10"
        cue: "field must be cleared first"
      - current: "T10"
        next: "T07"
        cue: "specific bleeding point is visible"
      - current: "T07"
        next: "T04"
        cue: "broader cautery/dissection can resume"
    phase_return:
      target: "previous_normal_phase"
      cue: "field is clear and bleeding is controlled"
