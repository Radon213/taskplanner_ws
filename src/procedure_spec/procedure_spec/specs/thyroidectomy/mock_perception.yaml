period_sec: 2.0

stages:
  - name: initial_setup
    duration_ticks: 1
    phase_hypotheses:
      - phase_id: exposure
        confidence: 0.88
      - phase_id: dissection
        confidence: 0.18
    observations:
      - instrument_id: retractor
        location_id: main_tray_slot_1
        location_type: tray_slot
        confidence: 0.94
      - instrument_id: cautery
        location_id: main_tray_slot_2
        location_type: tray_slot
        confidence: 0.93
      - instrument_id: metzenbaum
        location_id: main_tray_slot_3
        location_type: tray_slot
        confidence: 0.93
      - instrument_id: suction
        location_id: main_tray_slot_4
        location_type: tray_slot
        confidence: 0.93
      - instrument_id: right_angle
        location_id: main_tray_slot_5
        location_type: tray_slot
        confidence: 0.92
      - instrument_id: forceps
        location_id: main_tray_slot_6
        location_type: tray_slot
        confidence: 0.92
    scene_summary: >-
      Initial sterile setup before the case begins. All thyroidectomy instruments
      are resting in their home tray slots.
    uncertainty: 0.46

  - name: strap_muscle_exposure
    duration_ticks: 6
    phase_hypotheses:
      - phase_id: exposure
        confidence: 0.93
      - phase_id: dissection
        confidence: 0.21
    observations:
      - instrument_id: retractor
        location_id: field_region_thyroid
        location_type: surgical_field
        confidence: 0.97
      - instrument_id: cautery
        location_id: main_tray_slot_2
        location_type: tray_slot
        confidence: 0.89
      - instrument_id: metzenbaum
        location_id: main_tray_slot_3
        location_type: tray_slot
        confidence: 0.85
    scene_summary: >-
      Open thyroidectomy exposure: strap muscles are retracted laterally and the
      thyroid isthmus is visible. The retractor remains in the field while
      cautery and Metzenbaum scissors stay on the tray.
    uncertainty: 0.10

  - name: metzen_request_for_capsular_entry
    duration_ticks: 2
    phase_hypotheses:
      - phase_id: exposure
        confidence: 0.91
      - phase_id: dissection
        confidence: 0.34
    observations:
      - instrument_id: retractor
        location_id: field_region_thyroid
        location_type: surgical_field
        confidence: 0.97
      - instrument_id: cautery
        location_id: main_tray_slot_2
        location_type: tray_slot
        confidence: 0.86
      - instrument_id: metzenbaum
        location_id: main_tray_slot_3
        location_type: tray_slot
        confidence: 0.88
    scene_summary: >-
      The surgeon asks for Metzenbaum scissors to begin capsular dissection
      while exposure is maintained over the thyroid lobe.
    surgeon_gesture:
      event_type: request_tool
      requested_tool: metzenbaum
      hand_pose: open_receive
      confidence: 0.84
      note: VLM sees the surgeon present an empty hand for Metzenbaum scissors.
    uncertainty: 0.11

  - name: post_handover_cleanup
    duration_ticks: 2
    phase_hypotheses:
      - phase_id: exposure
        confidence: 0.84
      - phase_id: dissection
        confidence: 0.42
    observations:
      - instrument_id: retractor
        location_id: field_region_thyroid
        location_type: surgical_field
        confidence: 0.95
      - instrument_id: cautery
        location_id: main_tray_slot_2
        location_type: tray_slot
        confidence: 0.82
    scene_summary: >-
      The tray briefly shows an empty Metzenbaum slot after handover while the
      assistant keeps exposure steady.
    uncertainty: 0.16

  - name: capsular_dissection_stable
    duration_ticks: 6
    phase_hypotheses:
      - phase_id: dissection
        confidence: 0.90
      - phase_id: hemostasis
        confidence: 0.26
      - phase_id: vessel_control
        confidence: 0.20
    observations:
      - instrument_id: metzenbaum
        location_id: field_region_thyroid
        location_type: surgical_field
        confidence: 0.96
      - instrument_id: suction
        location_id: main_tray_slot_4
        location_type: tray_slot
        confidence: 0.87
      - instrument_id: right_angle
        location_id: main_tray_slot_5
        location_type: tray_slot
        confidence: 0.84
    scene_summary: >-
      Capsular dissection is underway around the thyroid lobe. Metzenbaum
      scissors work in the field while suction stays ready on the tray.
    uncertainty: 0.15

  - name: metzen_return_window
    duration_ticks: 2
    phase_hypotheses:
      - phase_id: dissection
        confidence: 0.86
      - phase_id: hemostasis
        confidence: 0.29
    observations:
      - instrument_id: metzenbaum
        location_id: mayo_recovery_zone
        location_type: mayo_recovery_zone
        confidence: 0.83
      - instrument_id: suction
        location_id: mayo_reuse_zone
        location_type: mayo_reuse_zone
        confidence: 0.85
      - instrument_id: right_angle
        location_id: main_tray_slot_5
        location_type: tray_slot
        confidence: 0.81
    scene_summary: >-
      The surgeon sets the used Metzenbaum onto the robot-side mayo recovery
      zone before the next instrument exchange.
    surgeon_gesture:
      event_type: return_tool
      requested_tool: metzenbaum
      hand_pose: present_return
      confidence: 0.82
      note: VLM sees the surgeon place a used Metzenbaum onto the mayo recovery zone for pickup.
    uncertainty: 0.18

  - name: minor_bleeding_hemostasis_window
    duration_ticks: 3
    phase_hypotheses:
      - phase_id: dissection
        confidence: 0.62
      - phase_id: hemostasis
        confidence: 0.58
      - phase_id: vessel_control
        confidence: 0.31
    observations:
      - instrument_id: suction
        location_id: field_region_thyroid
        location_type: surgical_field
        confidence: 0.88
      - instrument_id: cautery
        location_id: field_region_thyroid
        location_type: surgical_field
        confidence: 0.82
    scene_summary: >-
      A small venous ooze obscures the capsule and both suction and cautery
      become active in the field after the used Metzenbaum has been handed off for recovery.
    uncertainty: 0.44

  - name: dissection_resume
    duration_ticks: 2
    phase_hypotheses:
      - phase_id: dissection
        confidence: 0.88
      - phase_id: hemostasis
        confidence: 0.28
    observations:
      - instrument_id: suction
        location_id: mayo_reuse_zone
        location_type: mayo_reuse_zone
        confidence: 0.84
      - instrument_id: right_angle
        location_id: main_tray_slot_5
        location_type: tray_slot
        confidence: 0.81
    scene_summary: >-
      The field clears and dissection resumes with suction nearby while the
      right-angle clamp remains visible on the tray ahead of superior pole work.
    uncertainty: 0.16

  - name: superior_pole_vessel_control
    duration_ticks: 6
    phase_hypotheses:
      - phase_id: vessel_control
        confidence: 0.91
      - phase_id: hemostasis
        confidence: 0.35
      - phase_id: dissection
        confidence: 0.16
    observations:
      - instrument_id: cautery
        location_id: field_region_thyroid
        location_type: surgical_field
        confidence: 0.95
      - instrument_id: suction
        location_id: field_region_thyroid
        location_type: surgical_field
        confidence: 0.91
      - instrument_id: right_angle
        location_id: main_tray_slot_5
        location_type: tray_slot
        confidence: 0.89
    scene_summary: >-
      Dissection has reached the superior pole. Suction and cautery are active
      in the field while the right-angle clamp remains ready on the tray.
    uncertainty: 0.14

  - name: right_angle_request
    duration_ticks: 2
    phase_hypotheses:
      - phase_id: vessel_control
        confidence: 0.93
      - phase_id: hemostasis
        confidence: 0.28
    observations:
      - instrument_id: cautery
        location_id: field_region_thyroid
        location_type: surgical_field
        confidence: 0.95
      - instrument_id: suction
        location_id: field_region_thyroid
        location_type: surgical_field
        confidence: 0.91
      - instrument_id: right_angle
        location_id: main_tray_slot_5
        location_type: tray_slot
        confidence: 0.92
    scene_summary: >-
      The surgeon requests a right-angle clamp to isolate superior pole vessels.
    surgeon_gesture:
      event_type: request_tool
      requested_tool: right_angle
      hand_pose: open_receive
      confidence: 0.87
      note: VLM sees an empty receiving hand extended for the right-angle clamp.
    uncertainty: 0.10

  - name: post_clamp_handover_cleanup
    duration_ticks: 2
    phase_hypotheses:
      - phase_id: vessel_control
        confidence: 0.86
      - phase_id: hemostasis
        confidence: 0.31
    observations:
      - instrument_id: cautery
        location_id: field_region_thyroid
        location_type: surgical_field
        confidence: 0.93
      - instrument_id: suction
        location_id: field_region_thyroid
        location_type: surgical_field
        confidence: 0.89
    scene_summary: >-
      The right-angle clamp has left the tray after handover and the field
      remains focused on vessel control.
    uncertainty: 0.17

  - name: right_angle_return_window
    duration_ticks: 2
    phase_hypotheses:
      - phase_id: closure
        confidence: 0.82
      - phase_id: vessel_control
        confidence: 0.36
    observations:
      - instrument_id: right_angle
        location_id: mayo_recovery_zone
        location_type: mayo_recovery_zone
        confidence: 0.84
      - instrument_id: suction
        location_id: mayo_reuse_zone
        location_type: mayo_reuse_zone
        confidence: 0.82
      - instrument_id: forceps
        location_id: main_tray_slot_6
        location_type: tray_slot
        confidence: 0.88
    scene_summary: >-
      The surgeon sets the used right-angle clamp into the robot-side mayo
      recovery zone as the case transitions toward closure.
    surgeon_gesture:
      event_type: return_tool
      requested_tool: right_angle
      hand_pose: present_return
      confidence: 0.85
      note: VLM sees the surgeon place the used right-angle clamp into the mayo recovery zone for pickup.
    uncertainty: 0.18

  - name: closure_setup
    duration_ticks: 6
    phase_hypotheses:
      - phase_id: closure
        confidence: 0.90
      - phase_id: hemostasis
        confidence: 0.23
    observations:
      - instrument_id: forceps
        location_id: main_tray_slot_6
        location_type: tray_slot
        confidence: 0.90
      - instrument_id: suction
        location_id: mayo_reuse_zone
        location_type: mayo_reuse_zone
        confidence: 0.83
    scene_summary: >-
      After superior pole control, the field quiets and closure begins. Forceps
      are available for soft-tissue approximation while suction remains in the mayo reuse zone.
    uncertainty: 0.12
