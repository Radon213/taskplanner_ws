period_sec: 2.0

stages:
  - name: hemostasis_voice_cautery
    phase_id: hemostasis
    duration_ticks: 1
    event_type: voice_request
    intent: urgent_hemostasis
    requested_tool: cautery
    voice_text: cautery please
    ready_for_handover: true
    scene_note: Surgeon verbally requests cautery for focused hemostasis.
  - name: vessel_control_voice_right_angle
    phase_id: vessel_control
    duration_ticks: 1
    event_type: voice_request
    intent: isolate_vessels
    requested_tool: right_angle
    voice_text: right-angle clamp please
    ready_for_handover: true
    scene_note: Surgeon verbally asks for the right-angle clamp.
  - name: closure_voice_forceps
    phase_id: closure
    duration_ticks: 1
    event_type: voice_request
    intent: closure_support
    requested_tool: forceps
    voice_text: tissue forceps please
    ready_for_handover: true
    scene_note: Surgeon asks for tissue forceps during closure support.
