procedure_id: thyroidectomy
procedure_display_name: Open Thyroidectomy
procedure_display_name_ko: 갑상선절제술

phases:
  - id: exposure
    display_name: Exposure
    display_name_ko: 노출
    possible_next:
      - dissection
      - hemostasis
    expected_instruments:
      - retractor
      - cautery
      - metzenbaum
    min_duration_sec: 5

  - id: dissection
    display_name: Dissection
    display_name_ko: 박리
    possible_next:
      - vessel_control
      - hemostasis
    expected_instruments:
      - metzenbaum
      - suction
    min_duration_sec: 10

  - id: hemostasis
    display_name: Hemostasis
    display_name_ko: 지혈
    possible_next:
      - dissection
      - vessel_control
      - closure
    expected_instruments:
      - cautery
      - suction
      - forceps
    min_duration_sec: 4

  - id: vessel_control
    display_name: Vessel Control
    display_name_ko: 혈관 제어
    possible_next:
      - closure
      - hemostasis
    expected_instruments:
      - right_angle
      - cautery
      - suction
    min_duration_sec: 8

  - id: closure
    display_name: Closure
    display_name_ko: 봉합
    possible_next:
      - exposure
    expected_instruments:
      - forceps
      - suction
    min_duration_sec: 6
