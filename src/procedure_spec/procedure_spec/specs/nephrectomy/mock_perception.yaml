period_sec: 2.0

stages:
  - name: initial_setup
    duration_ticks: 1
    phase_hypotheses:
      - phase_id: access_exposure
        confidence: 0.87
      - phase_id: hilar_dissection
        confidence: 0.18
    observations:
      - instrument_id: grasper
        location_id: main_tray_slot_1
        location_type: tray_slot
        confidence: 0.94
      - instrument_id: bipolar
        location_id: main_tray_slot_2
        location_type: tray_slot
        confidence: 0.93
      - instrument_id: scissors
        location_id: main_tray_slot_3
        location_type: tray_slot
        confidence: 0.93
      - instrument_id: suction_irrigator
        location_id: main_tray_slot_4
        location_type: tray_slot
        confidence: 0.93
      - instrument_id: right_angle
        location_id: main_tray_slot_5
        location_type: tray_slot
        confidence: 0.92
      - instrument_id: clip_applier
        location_id: main_tray_slot_6
        location_type: tray_slot
        confidence: 0.92
      - instrument_id: needle_driver
        location_id: main_tray_slot_7
        location_type: tray_slot
        confidence: 0.92
      - instrument_id: forceps
        location_id: main_tray_slot_8
        location_type: tray_slot
        confidence: 0.92
    scene_summary: >-
      Initial sterile setup before nephrectomy begins. All instruments are still
      parked in their home tray slots.
    uncertainty: 0.46

  - name: colon_reflection_exposure
    duration_ticks: 6
    phase_hypotheses:
      - phase_id: access_exposure
        confidence: 0.92
      - phase_id: hilar_dissection
        confidence: 0.20
    observations:
      - instrument_id: grasper
        location_id: field_region_kidney_hilum
        location_type: surgical_field
        confidence: 0.96
      - instrument_id: bipolar
        location_id: main_tray_slot_2
        location_type: tray_slot
        confidence: 0.88
      - instrument_id: scissors
        location_id: main_tray_slot_3
        location_type: tray_slot
        confidence: 0.84
    scene_summary: >-
      Colon reflection and upper-pole exposure are underway. The grasper keeps
      Gerota fascia elevated while bipolar energy remains on the tray.
    uncertainty: 0.11

  - name: explicit_bipolar_request
    duration_ticks: 2
    phase_hypotheses:
      - phase_id: access_exposure
        confidence: 0.90
      - phase_id: hilar_dissection
        confidence: 0.33
    observations:
      - instrument_id: grasper
        location_id: field_region_kidney_hilum
        location_type: surgical_field
        confidence: 0.96
      - instrument_id: bipolar
        location_id: main_tray_slot_2
        location_type: tray_slot
        confidence: 0.90
      - instrument_id: scissors
        location_id: main_tray_slot_3
        location_type: tray_slot
        confidence: 0.84
    scene_summary: >-
      The surgeon asks for bipolar energy to control small oozing while staying
      in the exposure phase.
    surgeon_gesture:
      event_type: request_tool
      requested_tool: bipolar
      hand_pose: open_receive
      confidence: 0.85
      note: VLM sees the surgeon extend an empty hand for bipolar forceps.
    uncertainty: 0.10

  - name: post_bipolar_handover_cleanup
    duration_ticks: 2
    phase_hypotheses:
      - phase_id: access_exposure
        confidence: 0.82
      - phase_id: hilar_dissection
        confidence: 0.40
    observations:
      - instrument_id: grasper
        location_id: field_region_kidney_hilum
        location_type: surgical_field
        confidence: 0.94
      - instrument_id: scissors
        location_id: main_tray_slot_3
        location_type: tray_slot
        confidence: 0.79
    scene_summary: >-
      The bipolar slot is temporarily empty after handover while exposure at the
      renal hilum is maintained.
    uncertainty: 0.16

  - name: hilar_dissection_stable
    duration_ticks: 6
    phase_hypotheses:
      - phase_id: hilar_dissection
        confidence: 0.90
      - phase_id: hemostasis
        confidence: 0.24
      - phase_id: pedicle_control
        confidence: 0.18
    observations:
      - instrument_id: grasper
        location_id: field_region_kidney_hilum
        location_type: surgical_field
        confidence: 0.95
      - instrument_id: suction_irrigator
        location_id: main_tray_slot_4
        location_type: tray_slot
        confidence: 0.88
      - instrument_id: right_angle
        location_id: main_tray_slot_5
        location_type: tray_slot
        confidence: 0.86
    scene_summary: >-
      The renal hilum is being dissected cleanly. The grasper works in the field
      while suction irrigator remains on the tray and the right-angle is ready.
    uncertainty: 0.15

  - name: bipolar_return_window
    duration_ticks: 2
    phase_hypotheses:
      - phase_id: hilar_dissection
        confidence: 0.85
      - phase_id: hemostasis
        confidence: 0.31
    observations:
      - instrument_id: bipolar
        location_id: mayo_recovery_zone
        location_type: mayo_recovery_zone
        confidence: 0.84
      - instrument_id: suction_irrigator
        location_id: main_tray_slot_4
        location_type: tray_slot
        confidence: 0.86
      - instrument_id: right_angle
        location_id: main_tray_slot_5
        location_type: tray_slot
        confidence: 0.82
    scene_summary: >-
      The surgeon places the used bipolar forceps into the robot-side mayo
      recovery zone before the next hilar step.
    surgeon_gesture:
      event_type: return_tool
      requested_tool: bipolar
      hand_pose: present_return
      confidence: 0.83
      note: VLM sees the surgeon place bipolar forceps into the mayo recovery zone for recovery.
    uncertainty: 0.18

  - name: venous_ooze_hemostasis_window
    duration_ticks: 3
    phase_hypotheses:
      - phase_id: hilar_dissection
        confidence: 0.61
      - phase_id: hemostasis
        confidence: 0.57
      - phase_id: pedicle_control
        confidence: 0.32
    observations:
      - instrument_id: grasper
        location_id: field_region_kidney_hilum
        location_type: surgical_field
        confidence: 0.91
      - instrument_id: suction_irrigator
        location_id: field_region_kidney_hilum
        location_type: surgical_field
        confidence: 0.89
    scene_summary: >-
      Minor venous oozing around the hilum makes the scene ambiguous between
      dissection and hemostasis after bipolar has been set aside for robot recovery.
    uncertainty: 0.43

  - name: hilar_dissection_resume
    duration_ticks: 2
    phase_hypotheses:
      - phase_id: hilar_dissection
        confidence: 0.88
      - phase_id: hemostasis
        confidence: 0.27
    observations:
      - instrument_id: grasper
        location_id: field_region_kidney_hilum
        location_type: surgical_field
        confidence: 0.94
      - instrument_id: suction_irrigator
        location_id: mayo_reuse_zone
        location_type: mayo_reuse_zone
        confidence: 0.85
      - instrument_id: right_angle
        location_id: main_tray_slot_5
        location_type: tray_slot
        confidence: 0.82
    scene_summary: >-
      The field clears and hilar dissection resumes with the right-angle clamp
      ready for vessel looping.
    uncertainty: 0.16

  - name: pedicle_control_stable
    duration_ticks: 6
    phase_hypotheses:
      - phase_id: pedicle_control
        confidence: 0.91
      - phase_id: hemostasis
        confidence: 0.34
      - phase_id: hilar_dissection
        confidence: 0.17
    observations:
      - instrument_id: suction_irrigator
        location_id: field_region_kidney_hilum
        location_type: surgical_field
        confidence: 0.90
      - instrument_id: clip_applier
        location_id: main_tray_slot_6
        location_type: tray_slot
        confidence: 0.90
    scene_summary: >-
      The renal artery and vein are isolated. Suction remains active in the
      field while the clip applier stays ready on the tray after bipolar was
      already handed off for recovery.
    uncertainty: 0.13

  - name: explicit_clip_request
    duration_ticks: 2
    phase_hypotheses:
      - phase_id: pedicle_control
        confidence: 0.93
      - phase_id: hemostasis
        confidence: 0.25
    observations:
      - instrument_id: suction_irrigator
        location_id: field_region_kidney_hilum
        location_type: surgical_field
        confidence: 0.90
      - instrument_id: clip_applier
        location_id: main_tray_slot_6
        location_type: tray_slot
        confidence: 0.93
    scene_summary: >-
      The surgeon requests the clip applier to secure the renal pedicle.
    surgeon_gesture:
      event_type: request_tool
      requested_tool: clip_applier
      hand_pose: open_receive
      confidence: 0.88
      note: VLM sees an empty hand extended for the clip applier.
    uncertainty: 0.10

  - name: post_clip_handover_cleanup
    duration_ticks: 2
    phase_hypotheses:
      - phase_id: pedicle_control
        confidence: 0.86
      - phase_id: hemostasis
        confidence: 0.30
    observations:
      - instrument_id: suction_irrigator
        location_id: field_region_kidney_hilum
        location_type: surgical_field
        confidence: 0.89
    scene_summary: >-
      The clip applier has left the tray after handover and pedicle control is
      still underway while the previously used bipolar has already been
      recovered away from the field.
    uncertainty: 0.17

  - name: clip_return_window
    duration_ticks: 2
    phase_hypotheses:
      - phase_id: closure
        confidence: 0.81
      - phase_id: pedicle_control
        confidence: 0.36
    observations:
      - instrument_id: clip_applier
        location_id: mayo_recovery_zone
        location_type: mayo_recovery_zone
        confidence: 0.85
      - instrument_id: needle_driver
        location_id: main_tray_slot_7
        location_type: tray_slot
        confidence: 0.88
      - instrument_id: forceps
        location_id: main_tray_slot_8
        location_type: tray_slot
        confidence: 0.84
    scene_summary: >-
      The surgeon places the used clip applier into the robot-side mayo recovery
      zone before closure instruments take over.
    surgeon_gesture:
      event_type: return_tool
      requested_tool: clip_applier
      hand_pose: present_return
      confidence: 0.86
      note: VLM sees the used clip applier being placed into the mayo recovery zone for retrieval.
    uncertainty: 0.18

  - name: closure_setup
    duration_ticks: 6
    phase_hypotheses:
      - phase_id: closure
        confidence: 0.89
      - phase_id: hemostasis
        confidence: 0.22
    observations:
      - instrument_id: needle_driver
        location_id: main_tray_slot_7
        location_type: tray_slot
        confidence: 0.90
      - instrument_id: forceps
        location_id: main_tray_slot_8
        location_type: tray_slot
        confidence: 0.87
      - instrument_id: suction_irrigator
        location_id: mayo_reuse_zone
        location_type: mayo_reuse_zone
        confidence: 0.82
    scene_summary: >-
      The specimen is out and port-site closure begins. Needle driver and forceps
      are available while suction remains parked in the mayo reuse zone.
    uncertainty: 0.12
