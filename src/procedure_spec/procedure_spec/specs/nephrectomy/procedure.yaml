procedure_id: nephrectomy
procedure_display_name: Laparoscopic Nephrectomy
procedure_display_name_ko: 복강경 신장절제술

phases:
  - id: access_exposure
    display_name: Access And Exposure
    display_name_ko: 접근/노출
    possible_next:
      - hilar_dissection
      - hemostasis
    expected_instruments:
      - grasper
      - bipolar
      - scissors
    min_duration_sec: 5

  - id: hilar_dissection
    display_name: Hilar Dissection
    display_name_ko: 폐문 박리
    possible_next:
      - pedicle_control
      - hemostasis
    expected_instruments:
      - grasper
      - suction_irrigator
      - right_angle
    min_duration_sec: 8

  - id: hemostasis
    display_name: Hemostasis
    display_name_ko: 지혈
    possible_next:
      - hilar_dissection
      - pedicle_control
      - closure
    expected_instruments:
      - bipolar
      - suction_irrigator
      - clip_applier
    min_duration_sec: 4

  - id: pedicle_control
    display_name: Pedicle Control
    display_name_ko: 혈관경 제어
    possible_next:
      - closure
      - hemostasis
    expected_instruments:
      - clip_applier
      - suction_irrigator
      - right_angle
    min_duration_sec: 6

  - id: closure
    display_name: Closure
    display_name_ko: 봉합
    possible_next:
      - access_exposure
    expected_instruments:
      - needle_driver
      - forceps
      - suction_irrigator
    min_duration_sec: 5
