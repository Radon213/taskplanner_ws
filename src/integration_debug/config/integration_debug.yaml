schema: taskplanner.integration_debug.v1
monitor_window_sec: 5.0
bed_robot_arm_status_max_age_sec: 3.0
status_period_sec: 1.0
heartbeat_timeout_sec: 6.0
action_watchdog:
  goal_response_timeout_sec: 10.0
  feedback_timeout_sec: 30.0
  max_duration_sec: 300.0
  server_loss_grace_sec: 5.0

asr:
  topic: /sensors/surgeon/sentence
  default_endpoint: cloud
  cloud_server_url: wss://arpa.worker-02.puzzle-ai.com
  lan_server_url: ws://192.168.1.5:1196/

surgery_record:
  input_dir: /surgery-record-inputs
  default_endpoint: https://dev.puzzle-ai.com:6627/api/v1/surgery/img_texts
  allowed_endpoints:
    - https://dev.puzzle-ai.com:6627/api/v1/surgery/img_texts
  timeout_sec: 35.0

inputs:
  - name: surgeon_sentence
    topic: /sensors/surgeon/sentence
    type: std_msgs/msg/String
    expected_hz: 0.0
    stale_after_sec: 0.0
    qos: reliable_volatile
  - name: admitted_request_text
    topic: /surgery/audio/request_text
    type: std_msgs/msg/String
    expected_hz: 0.0
    stale_after_sec: 0.0
    qos: reliable_volatile
  - name: speech_input_status
    topic: /input/speech/status
    type: surgical_msgs/msg/InputSourceStatus
    expected_hz: 15.0
    stale_after_sec: 3.0
    qos: reliable_volatile
  - name: external_cv_contract
    topic: /integration/cv_contract/status
    type: std_msgs/msg/String
    expected_hz: 15.0
    stale_after_sec: 3.0
    qos: reliable_transient_local
  - name: cam1_camera
    topic: /synced/cam_1/status
    type: std_msgs/msg/String
    expected_hz: 15.0
    stale_after_sec: 3.0
    qos: reliable_transient_local
  - name: cam2_camera
    topic: /synced/cam_2/status
    type: std_msgs/msg/String
    expected_hz: 15.0
    stale_after_sec: 3.0
    qos: reliable_transient_local
  - name: cam3_camera
    topic: /synced/cam_3/status
    type: std_msgs/msg/String
    expected_hz: 15.0
    stale_after_sec: 3.0
    qos: reliable_transient_local
  - name: cam4_camera
    topic: /synced/cam_4/status
    type: std_msgs/msg/String
    expected_hz: 1.0
    stale_after_sec: 3.0
    qos: reliable_transient_local
  - name: flir_camera
    topic: /synced/flir/status
    type: std_msgs/msg/String
    expected_hz: 1.0
    stale_after_sec: 3.0
    qos: reliable_transient_local

outputs:
  - topic: /surgery/context
    type: surgical_interop_msgs/msg/SurgeryContext
    default_hz: 1.0
    qos: snapshot
  - topic: /surgery/instruments
    type: surgical_interop_msgs/msg/InstrumentStateArray
    default_hz: 1.0
    qos: snapshot
  - topic: /surgery/robots
    type: surgical_interop_msgs/msg/RobotStateArray
    default_hz: 1.0
    qos: snapshot
  - topic: /surgery/events
    type: surgical_interop_msgs/msg/SurgeryEvent
    default_hz: 1.0
    qos: event
  - topic: /surgery/clinical_observations
    type: surgical_interop_msgs/msg/ClinicalObservationArray
    default_hz: 1.0
    qos: snapshot
  - topic: /surgery/health
    type: surgical_interop_msgs/msg/SurgeryHealth
    default_hz: 1.0
    qos: snapshot

blocked_nodes:
  - tree_executor
  - simulation_manager
  - surgical_interop_execution_bridge
  - surgical_interop_gateway

voice:
  request_topic: /surgery/audio/request_text
  default_source_location: tray
  default_target_location: surgeon
  aliases:
    "켈리": "Kelly forceps"
    "kelly": "Kelly forceps"
    "알리스": "Allis forceps"
    "allis": "Allis forceps"
    "보비": "Bovie surgical cautery"
    "bovie": "Bovie surgical cautery"
    "바이폴라": "Bipolar forceps"
    "bipolar": "Bipolar forceps"
    "모스키토": "Mosquito forceps"
    "mosquito": "Mosquito forceps"
    "메첸바움": "Metzenbaum scissors"
    "metzenbaum": "Metzenbaum scissors"
    "석션": "Yankauer suction"
    "suction": "Yankauer suction"
