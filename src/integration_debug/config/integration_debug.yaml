schema: taskplanner.integration_debug.v1
monitor_window_sec: 5.0
bed_robot_arm_status_max_age_sec: 3.0
status_period_sec: 1.0
heartbeat_timeout_sec: 6.0
action_watchdog:
  goal_response_timeout_sec: 10.0
  change_tool_response_timeout_sec: 120.0
  feedback_timeout_sec: 30.0
  max_duration_sec: 300.0
  server_loss_grace_sec: 5.0

# One narrow typed-dispatch policy for every Debug ROS write.  The gateway
# accepts the generic shape
# {kind, endpoint, type, payload, timeout_sec}; endpoint may be this stable
# alias or the currently resolved ROS name.  ``legacy_operations`` exists only
# to keep the existing browser contract working during migration.  New callers
# should send operation=dispatch and the generic payload directly.
dispatch:
  legacy_operations:
    tool_handover: tool_handover
    retraction_command: retraction_service
  endpoints:
    - name: tool_handover
      kind: action
      type: surgical_interop_msgs/action/ExecuteToolHandover
      endpoints:
        external: /surgery/tool_handover
        virtual: /integration/debug/virtual/tool_handover
      payload_codec: tool_handover
      physical: true
      single_flight: true
      timeout_sec: 300.0
      response_semantics: action
    - name: retraction_service
      kind: service
      type: surgical_interop_msgs/srv/ExecuteRetractionCommand
      endpoints:
        external: /surgery/retraction/command
        virtual: /integration/debug/virtual/retraction/command
      payload_codec: retraction_command
      physical: true
      single_flight: true
      timeout_sec: 120.0
      response_semantics: admission

asr:
  topic: /sensors/surgeon/sentence
  default_endpoint: cloud
  cloud_server_url: wss://arpa.worker-02.puzzle-ai.com
  lan_server_url: ws://192.168.1.5:1196/

surgery_record:
  input_dir: /surgery-record-inputs
  default_endpoint: https://192.168.1.5:6627/api/v1/surgery/img_texts
  allowed_endpoints:
    - https://192.168.1.5:6627/api/v1/surgery/img_texts
  timeout_sec: 35.0

inputs:
  - name: surgeon_sentence
    topic: /sensors/surgeon/sentence
    type: std_msgs/msg/String
    expected_hz: 0.0
    stale_after_sec: 0.0
    qos: reliable_volatile
  # CommandRouter owns executable admitted ASR.  Debug only observes its
  # faithful, non-executable relay after the router has received an utterance.
  - name: observed_surgeon_utterance
    topic: /surgery/audio/observed_utterance
    type: surgical_msgs/msg/SpeechUtterance
    expected_hz: 0.0
    stale_after_sec: 0.0
    qos: reliable_volatile
  - name: external_cv_contract
    topic: /integration/cv_contract/status
    type: std_msgs/msg/String
    expected_hz: 15.0
    stale_after_sec: 3.0
    qos: reliable_transient_local
  - name: cam1_camera
    topic: /synced/cam_1/status
    type: std_msgs/msg/String
    expected_hz: 15.0
    stale_after_sec: 3.0
    qos: reliable_transient_local
  - name: cam2_camera
    topic: /synced/cam_2/status
    type: std_msgs/msg/String
    expected_hz: 15.0
    stale_after_sec: 3.0
    qos: reliable_transient_local
  - name: cam3_camera
    topic: /synced/cam_3/status
    type: std_msgs/msg/String
    expected_hz: 15.0
    stale_after_sec: 3.0
    qos: reliable_transient_local
  - name: cam4_camera
    topic: /synced/cam_4/status
    type: std_msgs/msg/String
    expected_hz: 1.0
    stale_after_sec: 3.0
    qos: reliable_transient_local
  - name: flir_camera
    topic: /synced/flir/status
    type: std_msgs/msg/String
    expected_hz: 1.0
    stale_after_sec: 3.0
    qos: reliable_transient_local

outputs:
  - topic: /surgery/context
    type: surgical_interop_msgs/msg/SurgeryContext
    default_hz: 1.0
    qos: snapshot
  - topic: /surgery/instruments
    type: surgical_interop_msgs/msg/InstrumentStateArray
    default_hz: 1.0
    qos: snapshot
  - topic: /surgery/robots
    type: surgical_interop_msgs/msg/RobotStateArray
    default_hz: 1.0
    qos: snapshot
  - topic: /surgery/events
    type: surgical_interop_msgs/msg/SurgeryEvent
    default_hz: 1.0
    qos: event
  - topic: /surgery/clinical_observations
    type: surgical_interop_msgs/msg/ClinicalObservationArray
    default_hz: 1.0
    qos: snapshot
  - topic: /surgery/health
    type: surgical_interop_msgs/msg/SurgeryHealth
    default_hz: 1.0
    qos: snapshot

blocked_nodes:
  - tree_executor
  - simulation_manager
  - surgical_interop_execution_bridge
  - surgical_interop_gateway

voice:
  observed_utterance_topic: /surgery/audio/observed_utterance
  default_source_location: tray
  default_target_location: surgeon
  aliases:
    "켈리": "Kelly forceps"
    "kelly": "Kelly forceps"
    "알리스": "Allis forceps"
    "allis": "Allis forceps"
    "보비": "Bovie surgical cautery"
    "bovie": "Bovie surgical cautery"
    "바이폴라": "Bipolar forceps"
    "bipolar": "Bipolar forceps"
    "모스키토": "Mosquito forceps"
    "mosquito": "Mosquito forceps"
    "메첸바움": "Metzenbaum scissors"
    "metzenbaum": "Metzenbaum scissors"
    "석션": "Yankauer suction"
    "suction": "Yankauer suction"
