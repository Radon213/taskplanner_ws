name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  docker-build-and-smoke:
    runs-on: ubuntu-latest
    env:
      BTOPS_REPO_URL: ${{ vars.BTOPS_REPO_URL || 'git@github.com:Radon213/btops_ws.git' }}
      BTOPS_REF: ${{ vars.BTOPS_REF || 'main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure BT Ops deploy key
        run: |
          if [ -z "${BTOPS_DEPLOY_KEY}" ]; then
            echo "BTOPS_DEPLOY_KEY secret is required for private BT Ops dependency checkout."
            exit 2
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${BTOPS_DEPLOY_KEY}" > ~/.ssh/btops_deploy_key
          chmod 600 ~/.ssh/btops_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/btops_deploy_key
          echo "SSH_AUTH_SOCK=${SSH_AUTH_SOCK}" >> "${GITHUB_ENV}"
        env:
          BTOPS_DEPLOY_KEY: ${{ secrets.BTOPS_DEPLOY_KEY }}

      - name: Build Docker image
        run: |
          docker compose build \
            --ssh default \
            --build-arg BTOPS_REPO_URL="${BTOPS_REPO_URL}" \
            --build-arg BTOPS_REF="${BTOPS_REF}" \
            taskplanner-dev

      - name: Build ROS workspace
        run: |
          docker compose run --rm taskplanner-dev bash -lc "colcon build --symlink-install"

      - name: Build webapp
        run: |
          docker compose run --rm taskplanner-dev bash -lc "cd webapp && npm ci && npm run build"

      - name: Smoke test thyroidectomy
        run: |
          docker compose run --rm taskplanner-dev bash -lc "source install/setup.bash && ros2 run bringup taskplanner_smoke_test --spec-name thyroidectomy"

      - name: Smoke test nephrectomy
        run: |
          docker compose run --rm taskplanner-dev bash -lc "source install/setup.bash && ros2 run bringup taskplanner_smoke_test --spec-name nephrectomy"
