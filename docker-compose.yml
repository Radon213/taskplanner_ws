services:
  taskplanner-dev:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        btops_ws: ${BTOPS_LOCAL_CONTEXT:-../btops_ws}
      args:
        BTOPS_LOCAL_CONTEXT: ${BTOPS_LOCAL_CONTEXT:-../btops_ws}
        BTOPS_REF: ${BTOPS_REF:-main}
        AUTO_APMS_REPO_URL: ${AUTO_APMS_REPO_URL:-https://github.com/AutoAPMS/auto-apms.git}
        AUTO_APMS_REF: ${AUTO_APMS_REF:-1.5.1}
    image: taskplanner-ws:dev
    working_dir: /workspaces/taskplanner_ws
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/workspaces/taskplanner_ws
      - taskplanner_web_node_modules:/workspaces/taskplanner_ws/webapp/node_modules
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_AUTOMATIC_DISCOVERY_RANGE: ${ROS_AUTOMATIC_DISCOVERY_RANGE:-LOCALHOST}
      VLM_MODE: ${VLM_MODE:-mock}
      VLM_BASE_URL: ${VLM_BASE_URL:-http://host.docker.internal:8000}
      VLM_MODEL_ID: ${VLM_MODEL_ID:-nvidia/diffusiongemma-26B-A4B-it-NVFP4}
      VLM_API_MODE: ${VLM_API_MODE:-openai_compat}
      VLM_PUBLISH_PERIOD_SEC: ${VLM_PUBLISH_PERIOD_SEC:-1.0}
      ENABLE_NO_IMAGE_CAMERA: ${ENABLE_NO_IMAGE_CAMERA:-true}
      ENABLE_SYNTHETIC_SCENE_CAMERA: ${ENABLE_SYNTHETIC_SCENE_CAMERA:-false}
    stdin_open: true
    tty: true
    command: bash

  taskplanner-runtime:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        btops_ws: ${BTOPS_LOCAL_CONTEXT:-../btops_ws}
      args:
        BTOPS_LOCAL_CONTEXT: ${BTOPS_LOCAL_CONTEXT:-../btops_ws}
        BTOPS_REF: ${BTOPS_REF:-main}
        AUTO_APMS_REPO_URL: ${AUTO_APMS_REPO_URL:-https://github.com/AutoAPMS/auto-apms.git}
        AUTO_APMS_REF: ${AUTO_APMS_REF:-1.5.1}
    image: taskplanner-ws:dev
    working_dir: /workspaces/taskplanner_ws
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/workspaces/taskplanner_ws
      - taskplanner_web_node_modules:/workspaces/taskplanner_ws/webapp/node_modules
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_AUTOMATIC_DISCOVERY_RANGE: ${ROS_AUTOMATIC_DISCOVERY_RANGE:-LOCALHOST}
      VLM_MODE: ${VLM_MODE:-mock}
      VLM_BASE_URL: ${VLM_BASE_URL:-http://host.docker.internal:8000}
      VLM_MODEL_ID: ${VLM_MODEL_ID:-nvidia/diffusiongemma-26B-A4B-it-NVFP4}
      VLM_API_MODE: ${VLM_API_MODE:-openai_compat}
      VLM_PUBLISH_PERIOD_SEC: ${VLM_PUBLISH_PERIOD_SEC:-1.0}
      ENABLE_NO_IMAGE_CAMERA: ${ENABLE_NO_IMAGE_CAMERA:-true}
      ENABLE_SYNTHETIC_SCENE_CAMERA: ${ENABLE_SYNTHETIC_SCENE_CAMERA:-false}
    ports:
      - "${ROSBRIDGE_PORT:-9090}:9090"
    command: >
      bash -lc "colcon build --symlink-install --cmake-args -DBUILD_TESTING=OFF &&
      source install/setup.bash &&
      ros2 launch bringup taskplanner_mock.launch.py enable_rosbridge:=true rosbridge_port:=${ROSBRIDGE_PORT:-9090} vlm_mode:=${VLM_MODE:-mock} vlm_base_url:=${VLM_BASE_URL:-http://host.docker.internal:8000} vlm_model_id:=${VLM_MODEL_ID:-nvidia/diffusiongemma-26B-A4B-it-NVFP4} vlm_api_mode:=${VLM_API_MODE:-openai_compat} vlm_publish_period_sec:=${VLM_PUBLISH_PERIOD_SEC:-1.0} enable_no_image_camera:=${ENABLE_NO_IMAGE_CAMERA:-true} enable_synthetic_scene_camera:=${ENABLE_SYNTHETIC_SCENE_CAMERA:-false}"

  webapp:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        btops_ws: ${BTOPS_LOCAL_CONTEXT:-../btops_ws}
      args:
        BTOPS_LOCAL_CONTEXT: ${BTOPS_LOCAL_CONTEXT:-../btops_ws}
        BTOPS_REF: ${BTOPS_REF:-main}
        AUTO_APMS_REPO_URL: ${AUTO_APMS_REPO_URL:-https://github.com/AutoAPMS/auto-apms.git}
        AUTO_APMS_REF: ${AUTO_APMS_REF:-1.5.1}
    image: taskplanner-ws:dev
    working_dir: /workspaces/taskplanner_ws/webapp
    volumes:
      - .:/workspaces/taskplanner_ws
      - taskplanner_web_node_modules:/workspaces/taskplanner_ws/webapp/node_modules
    environment:
      VITE_ROSBRIDGE_URL: ws://127.0.0.1:${ROSBRIDGE_PORT:-9090}
    ports:
      - "${WEBAPP_PORT:-4173}:4173"
    command: >
      bash -lc "
        npm install &&
        npm run dev -- --host 0.0.0.0 --port 4173
      "

volumes:
  taskplanner_web_node_modules:
