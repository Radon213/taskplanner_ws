  taskplanner-asr:
    profiles:
      - live
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        btops_ws: ${BTOPS_LOCAL_CONTEXT:-../btops_ws}
      args:
        BTOPS_LOCAL_CONTEXT: ${BTOPS_LOCAL_CONTEXT:-../btops_ws}
        BTOPS_REF: ${BTOPS_REF:-main}
        AUTO_APMS_REPO_URL: ${AUTO_APMS_REPO_URL:-https://github.com/AutoAPMS/auto-apms.git}
        AUTO_APMS_REF: ${AUTO_APMS_REF:-19ac8d558e35f657b8464694c5ddc524c6c31861}
        TASKPLANNER_BUILD_VERSION: ${TASKPLANNER_BUILD_VERSION:-0.1.0-dev}
        TASKPLANNER_BUILD_SHA: ${TASKPLANNER_BUILD_SHA:-unknown}
        TASKPLANNER_SHADOW_CONTRACT_VERSION: ${TASKPLANNER_SHADOW_CONTRACT_VERSION:-shadow-rfdetr-preflight-v1}
    image: taskplanner-ws:dev
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 45s
    user: "${TASKPLANNER_UID:-1000}:${TASKPLANNER_GID:-1000}"
    working_dir: /workspaces/taskplanner_ws
    network_mode: host
    ipc: host
    volumes:
      - .:/workspaces/taskplanner_ws
      - ${TASKPLANNER_RUN_ROOT:-${HOME}/.local/share/taskplanner/runs}:/taskplanner-runs
      # Follow Ubuntu's selected PipeWire source without exposing the host's
      # complete runtime directory to the sidecar.
      - ${TASKPLANNER_PIPEWIRE_SOCKET:-/run/user/1000/pipewire-0}:/run/taskplanner-pipewire/pipewire-0
    environment:
      XDG_RUNTIME_DIR: /run/taskplanner-pipewire
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_AUTOMATIC_DISCOVERY_RANGE: ${ROS_AUTOMATIC_DISCOVERY_RANGE:-LOCALHOST}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      CYCLONEDDS_URI: ${TASKPLANNER_CONTAINER_CYCLONEDDS_URI-${CYCLONEDDS_URI:-}}
      TASKPLANNER_RUN_ROOT: /taskplanner-runs
      # Select only a reviewed route.  The node refuses arbitrary service-time
      # server_url overrides even though both endpoints use the same protocol.
      PUZZLE_ASR_ENDPOINT: ${PUZZLE_ASR_ENDPOINT:-cloud}
      PUZZLE_ASR_URL: ${PUZZLE_ASR_URL:-wss://arpa.worker-02.puzzle-ai.com}
      PUZZLE_ASR_LAN_URL: ${PUZZLE_ASR_LAN_URL:-ws://192.168.1.5:1196/}
      # Live-only policy: blank follows PUZZLE_ASR_ENDPOINT.  auto continuously
      # monitors the LAN WebSocket and chooses cloud only before a new session.
      PUZZLE_ASR_ROUTE_POLICY: ${PUZZLE_ASR_ROUTE_POLICY:-}
      PUZZLE_ASR_LAN_HEALTH_INTERVAL_SEC: ${PUZZLE_ASR_LAN_HEALTH_INTERVAL_SEC:-1.0}
      PUZZLE_ASR_LAN_HEALTH_FAILURE_INTERVAL_SEC: ${PUZZLE_ASR_LAN_HEALTH_FAILURE_INTERVAL_SEC:-0.5}
      PUZZLE_ASR_LAN_HEALTH_TIMEOUT_SEC: ${PUZZLE_ASR_LAN_HEALTH_TIMEOUT_SEC:-0.5}
      PUZZLE_ASR_LAN_HEALTH_STALE_AFTER_SEC: ${PUZZLE_ASR_LAN_HEALTH_STALE_AFTER_SEC:-2.0}
      SENTENCE_INPUT_TOPIC: ${SENTENCE_INPUT_TOPIC:-/sensors/surgeon/sentence}
      TASKPLANNER_ASR_CAPTURE_LOCK: ${TASKPLANNER_ASR_CAPTURE_LOCK:-/taskplanner-runs/asr/microphone.lock}
    healthcheck:
      # Process liveness is insufficient: wait until the ROS node advertises
      # its transient-local status publisher on the runtime DDS graph.
      test:
        - CMD-SHELL
        - >-
          bash -lc 'source /opt/ros/jazzy/setup.bash &&
          source /opt/btops_ws/install/setup.bash &&
          source /workspaces/taskplanner_ws/install/setup.bash &&
          ros2 topic info --no-daemon --spin-time 1.5 --verbose
          /input/asr/runtime_status | grep -q "Node name: taskplanner_asr"'
      interval: 5s
      start_interval: 1s
      timeout: 6s
      retries: 60
      start_period: 10s
    command: >
      bash -lc "if [ ! -f install/setup.bash ] || [ ! -x install/integration_debug/lib/integration_debug/operational_asr_node ]; then
        echo 'Taskplanner operational ASR install is missing or stale; rerun launcher with --build' >&2;
        exit 2;
      fi &&
      source install/setup.bash &&
      exec /workspaces/taskplanner_ws/install/integration_debug/lib/integration_debug/operational_asr_node"

