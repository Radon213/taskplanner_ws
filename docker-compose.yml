am4_semantics_topic:=${CAM4_SEMANTICS_TOPIC:-/surgery/perception/cam4/semantics/json} cv_contract_status_topic:=${CV_CONTRACT_STATUS_TOPIC:-/integration/cv_contract/status} cv_cam4_rgb_topic:=${CV_CAM4_RGB_TOPIC:-/synced/cam_4/color/image_raw/compressed} cv_cam4_rgb_alias_topic:=${CV_CAM4_RGB_ALIAS_TOPIC:-/surgery/images/cam4/compressed} cv_cam4_camera_info_topic:=${CV_CAM4_CAMERA_INFO_TOPIC:-/synced/cam_4/color/camera_info} cv_cam4_aligned_depth_topic:=${CV_CAM4_ALIGNED_DEPTH_TOPIC:-/synced/cam_4/depth/image_rect_raw} cv_handover_tray_rgb_topic:=${CV_HANDOVER_TRAY_RGB_TOPIC:-/surgery/images/tray/compressed} cv_handover_tray_camera_info_topic:=${CV_HANDOVER_TRAY_CAMERA_INFO_TOPIC:-/surgery/cameras/tray/color/camera_info} cv_handover_tray_aligned_depth_topic:=${CV_HANDOVER_TRAY_ALIGNED_DEPTH_TOPIC:-/surgery/cameras/tray/aligned_depth} enable_no_image_camera:=${ENABLE_NO_IMAGE_CAMERA:-true} enable_synthetic_scene_camera:=${ENABLE_SYNTHETIC_SCENE_CAMERA:-false} $${FIELD_SNAPSHOT_URL:+field_snapshot_url:=$${FIELD_SNAPSHOT_URL}};
