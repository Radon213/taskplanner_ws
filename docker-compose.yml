services:
  taskplanner-dev:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        btops_ws: ${BTOPS_LOCAL_CONTEXT:-../btops_ws}
      args:
        BTOPS_LOCAL_CONTEXT: ${BTOPS_LOCAL_CONTEXT:-../btops_ws}
        BTOPS_REF: ${BTOPS_REF:-main}
        AUTO_APMS_REPO_URL: ${AUTO_APMS_REPO_URL:-https://github.com/AutoAPMS/auto-apms.git}
        AUTO_APMS_REF: ${AUTO_APMS_REF:-1.5.1}
    image: taskplanner-ws:dev
    working_dir: /workspaces/taskplanner_ws
    network_mode: host
    ipc: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/workspaces/taskplanner_ws
      - taskplanner_web_node_modules:/workspaces/taskplanner_ws/webapp/node_modules
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_AUTOMATIC_DISCOVERY_RANGE: ${ROS_AUTOMATIC_DISCOVERY_RANGE:-LOCALHOST}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      FASTRTPS_DEFAULT_PROFILES_FILE: ${FASTRTPS_DEFAULT_PROFILES_FILE:-/workspaces/taskplanner_ws/config/fastdds_udp.xml}
      VLM_MODE: ${VLM_MODE:-real}
      VLM_BASE_URL: ${VLM_BASE_URL:-http://127.0.0.1:1234}
      VLM_MODEL_ID: ${VLM_MODEL_ID:-qwen3.6-35b-a3b-mtp@q2_k_xl}
      VLM_API_MODE: ${VLM_API_MODE:-openai_compat}
      VLM_PUBLISH_PERIOD_SEC: ${VLM_PUBLISH_PERIOD_SEC:-1.0}
      VLM_IMAGE_STALE_SEC: ${VLM_IMAGE_STALE_SEC:-3.0}
      VLM_MAX_OUTPUT_TOKENS: ${VLM_MAX_OUTPUT_TOKENS:-320}
      VLM_RESPONSE_FORMAT: ${VLM_RESPONSE_FORMAT:-json_schema}
      VLM_REASONING_EFFORT: ${VLM_REASONING_EFFORT:-none}
      VLM_CONTEXT_MODE: ${VLM_CONTEXT_MODE:-actor_log}
      SURGEON_ACTOR_MODE: ${SURGEON_ACTOR_MODE:-llm}
      ACTOR_BASE_URL: ${ACTOR_BASE_URL:-http://127.0.0.1:1234}
      ACTOR_MODEL_ID: ${ACTOR_MODEL_ID:-google/gemma-4-12b-qat}
      ACTOR_RESPONSE_FORMAT: ${ACTOR_RESPONSE_FORMAT:-json_schema}
      ACTOR_REASONING_EFFORT: ${ACTOR_REASONING_EFFORT:-none}
      ENABLE_NO_IMAGE_CAMERA: ${ENABLE_NO_IMAGE_CAMERA:-true}
      ENABLE_SYNTHETIC_SCENE_CAMERA: ${ENABLE_SYNTHETIC_SCENE_CAMERA:-false}
      FIELD_SNAPSHOT_URL: ${FIELD_SNAPSHOT_URL:-}
    stdin_open: true
    tty: true
    command: bash

  taskplanner-runtime:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        btops_ws: ${BTOPS_LOCAL_CONTEXT:-../btops_ws}
      args:
        BTOPS_LOCAL_CONTEXT: ${BTOPS_LOCAL_CONTEXT:-../btops_ws}
        BTOPS_REF: ${BTOPS_REF:-main}
        AUTO_APMS_REPO_URL: ${AUTO_APMS_REPO_URL:-https://github.com/AutoAPMS/auto-apms.git}
        AUTO_APMS_REF: ${AUTO_APMS_REF:-1.5.1}
    image: taskplanner-ws:dev
    working_dir: /workspaces/taskplanner_ws
    network_mode: host
    ipc: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/workspaces/taskplanner_ws
      - taskplanner_web_node_modules:/workspaces/taskplanner_ws/webapp/node_modules
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_AUTOMATIC_DISCOVERY_RANGE: ${ROS_AUTOMATIC_DISCOVERY_RANGE:-LOCALHOST}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      FASTRTPS_DEFAULT_PROFILES_FILE: ${FASTRTPS_DEFAULT_PROFILES_FILE:-/workspaces/taskplanner_ws/config/fastdds_udp.xml}
      VLM_MODE: ${VLM_MODE:-real}
      VLM_BASE_URL: ${VLM_BASE_URL:-http://127.0.0.1:1234}
      VLM_MODEL_ID: ${VLM_MODEL_ID:-qwen3.6-35b-a3b-mtp@q2_k_xl}
      VLM_API_MODE: ${VLM_API_MODE:-openai_compat}
      VLM_PUBLISH_PERIOD_SEC: ${VLM_PUBLISH_PERIOD_SEC:-1.0}
      VLM_IMAGE_STALE_SEC: ${VLM_IMAGE_STALE_SEC:-3.0}
      VLM_MAX_OUTPUT_TOKENS: ${VLM_MAX_OUTPUT_TOKENS:-320}
      VLM_RESPONSE_FORMAT: ${VLM_RESPONSE_FORMAT:-json_schema}
      VLM_REASONING_EFFORT: ${VLM_REASONING_EFFORT:-none}
      VLM_CONTEXT_MODE: ${VLM_CONTEXT_MODE:-actor_log}
      SURGEON_ACTOR_MODE: ${SURGEON_ACTOR_MODE:-llm}
      ACTOR_BASE_URL: ${ACTOR_BASE_URL:-http://127.0.0.1:1234}
      ACTOR_MODEL_ID: ${ACTOR_MODEL_ID:-google/gemma-4-12b-qat}
      ACTOR_RESPONSE_FORMAT: ${ACTOR_RESPONSE_FORMAT:-json_schema}
      ACTOR_REASONING_EFFORT: ${ACTOR_REASONING_EFFORT:-none}
      ENABLE_NO_IMAGE_CAMERA: ${ENABLE_NO_IMAGE_CAMERA:-true}
      ENABLE_SYNTHETIC_SCENE_CAMERA: ${ENABLE_SYNTHETIC_SCENE_CAMERA:-false}
      FIELD_SNAPSHOT_URL: ${FIELD_SNAPSHOT_URL:-}
    command: >
      bash -lc "colcon build --symlink-install --cmake-args -DBUILD_TESTING=OFF &&
      source install/setup.bash &&
      ros2 launch bringup taskplanner_mock.launch.py enable_rosbridge:=true rosbridge_port:=${ROSBRIDGE_PORT:-9090} rosbridge_address:=${ROSBRIDGE_ADDRESS:-127.0.0.1} vlm_mode:=${VLM_MODE:-real} vlm_base_url:=${VLM_BASE_URL:-http://127.0.0.1:1234} vlm_model_id:=${VLM_MODEL_ID:-qwen3.6-35b-a3b-mtp@q2_k_xl} vlm_api_mode:=${VLM_API_MODE:-openai_compat} vlm_publish_period_sec:=${VLM_PUBLISH_PERIOD_SEC:-1.0} vlm_image_stale_sec:=${VLM_IMAGE_STALE_SEC:-3.0} vlm_max_output_tokens:=${VLM_MAX_OUTPUT_TOKENS:-320} vlm_response_format:=${VLM_RESPONSE_FORMAT:-json_schema} vlm_reasoning_effort:=${VLM_REASONING_EFFORT:-none} vlm_context_mode:=${VLM_CONTEXT_MODE:-actor_log} surgeon_actor_mode:=${SURGEON_ACTOR_MODE:-llm} actor_base_url:=${ACTOR_BASE_URL:-http://127.0.0.1:1234} actor_model_id:=${ACTOR_MODEL_ID:-google/gemma-4-12b-qat} actor_response_format:=${ACTOR_RESPONSE_FORMAT:-json_schema} actor_reasoning_effort:=${ACTOR_REASONING_EFFORT:-none} enable_no_image_camera:=${ENABLE_NO_IMAGE_CAMERA:-true} enable_synthetic_scene_camera:=${ENABLE_SYNTHETIC_SCENE_CAMERA:-false} $${FIELD_SNAPSHOT_URL:+field_snapshot_url:=$${FIELD_SNAPSHOT_URL}}"

  webapp:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        btops_ws: ${BTOPS_LOCAL_CONTEXT:-../btops_ws}
      args:
        BTOPS_LOCAL_CONTEXT: ${BTOPS_LOCAL_CONTEXT:-../btops_ws}
        BTOPS_REF: ${BTOPS_REF:-main}
        AUTO_APMS_REPO_URL: ${AUTO_APMS_REPO_URL:-https://github.com/AutoAPMS/auto-apms.git}
        AUTO_APMS_REF: ${AUTO_APMS_REF:-1.5.1}
    image: taskplanner-ws:dev
    working_dir: /workspaces/taskplanner_ws/webapp
    volumes:
      - .:/workspaces/taskplanner_ws
      - taskplanner_web_node_modules:/workspaces/taskplanner_ws/webapp/node_modules
    environment:
      VITE_ROSBRIDGE_URL: ws://127.0.0.1:${ROSBRIDGE_PORT:-9090}
      VITE_LMSTUDIO_BASE_URL: ${VITE_LMSTUDIO_BASE_URL:-http://127.0.0.1:1234}
    ports:
      - "127.0.0.1:${WEBAPP_PORT:-4173}:4173"
    command: >
      bash -lc "
        npm install &&
        npm run dev -- --host 0.0.0.0 --port 4173
      "

volumes:
  taskplanner_web_node_modules:
