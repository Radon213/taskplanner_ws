      SHADOW_REPLAY_MODE: ${SHADOW_REPLAY_MODE:-elastic_demo}
      SHADOW_REPLAY_RATE: ${SHADOW_REPLAY_RATE:-1.0}
      PUBLISH_SHARED_STATE: ${PUBLISH_SHARED_STATE:-true}
      PUBLISH_SHARED_FREE_TEXT: ${PUBLISH_SHARED_FREE_TEXT:-false}
      ROSBRIDGE_SHADOW_PORT: ${ROSBRIDGE_SHADOW_PORT:-9099}
    depends_on:
      ninfer-manager:
        # The manager accepts requests before its optional model worker is
        # loaded.  Do not hold the ROS core behind a GPU/model warm-up: model
        # state remains visible as unloaded/loading/failed through the normal
        # provider catalog while deterministic ROS/voice paths come online.
        condition: service_started
      webapp:
        condition: service_started
    # ros2 launch rejects an empty `name:=` token. Optional perception routes
    # are therefore expanded inside the container only when configured.
    command: >
      bash -lc "if [ ! -f install/docker/setup.bash ] || [ ! -e install/docker/bringup/share/bringup/launch/taskplanner_shadow.launch.py ]; then
        echo 'Taskplanner container install/docker/setup.bash is missing; rerun launcher with --build' >&2;
        exit 2;
      fi &&
      source /opt/ros/jazzy/setup.bash &&
      source /opt/btops_ws/install/setup.bash &&
      source install/docker/setup.bash &&
      exec ros2 launch bringup taskplanner_shadow.launch.py
      case_id:=$${SHADOW_CASE_ID}
      source_bag_path:=/datasets/shadow/$${SHADOW_CASE_ID}
      annotation_cases_root:=/datasets/annotations/observable_tool_events/cases
      default_bundle:=$${SHADOW_BUNDLE_ID}
      interactive_replay:=true
      require_vlm:=$${SHADOW_REQUIRE_VLM}
      replay_mode:=$${SHADOW_REPLAY_MODE}
      replay_rate:=$${SHADOW_REPLAY_RATE}
      enable_rfdetr_perception:=$${ENABLE_RFDETR_PERCEPTION}
      perception_backend:=$${PERCEPTION_BACKEND}
      $${PERCEPTION_PROVIDER:+perception_provider:=$${PERCEPTION_PROVIDER}}
      $${PERCEPTION_LOCATION:+perception_location:=$${PERCEPTION_LOCATION}}
      $${PERCEPTION_ENDPOINT:+perception_endpoint:=$${PERCEPTION_ENDPOINT}}
      rfdetr_service_url:=$${RFDETR_SERVICE_URL}
      $${PNU_SERVICE_URL:+pnu_service_url:=$${PNU_SERVICE_URL}}
      cv_contract_status_topic:=$${CV_CONTRACT_STATUS_TOPIC}
      cv_cam4_rgb_topic:=$${CV_CAM4_RGB_TOPIC}
      cv_cam4_camera_info_topic:=$${CV_CAM4_CAMERA_INFO_TOPIC}
      cv_cam4_native_depth_compressed_topic:=$${CV_CAM4_NATIVE_DEPTH_COMPRESSED_TOPIC}
      cv_cam4_depth_camera_info_topic:=$${CV_CAM4_DEPTH_CAMERA_INFO_TOPIC}
      cv_cam4_depth_to_color_extrinsics_topic:=$${CV_CAM4_DEPTH_TO_COLOR_EXTRINSICS_TOPIC}
      cv_cam4_aligned_depth_compressed_topic:=$${CV_CAM4_ALIGNED_DEPTH_COMPRESSED_TOPIC}
      cv_cam4_aligned_depth_camera_info_topic:=$${CV_CAM4_ALIGNED_DEPTH_CAMERA_INFO_TOPIC}
      vlm_base_url:=$${VLM_BASE_URL}
      vlm_provider_id:=$${VLM_PROVIDER_ID}
      vlm_model_id:=$${VLM_MODEL_ID}
      vlm_api_mode:=$${VLM_API_MODE}
      publish_shared_state:=$${PUBLISH_SHARED_STATE}
      publish_shared_free_text:=$${PUBLISH_SHARED_FREE_TEXT}
      enable_rosbridge:=true
      rosbridge_port:=$${ROSBRIDGE_SHADOW_PORT}"

  taskplanner-asr:
    profiles:
      - live
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        btops_ws: ${BTOPS_LOCAL_CONTEXT:-../btops_ws}
      args:
        BTOPS_LOCAL_CONTEXT: ${BTOPS_LOCAL_CONTEXT:-../btops_ws}
        BTOPS_REF: ${BTOPS_REF:-main}
        AUTO_APMS_REPO_URL: ${AUTO_APMS_REPO_URL:-https://github.com/AutoAPMS/auto-apms.git}
        AUTO_APMS_REF: ${AUTO_APMS_REF:-19ac8d558e35f657b8464694c5ddc524c6c31861}
        TASKPLANNER_BUILD_VERSION: ${TASKPLANNER_BUILD_VERSION:-0.1.0-dev}
        TASKPLANNER_BUILD_SHA: ${TASKPLANNER_BUILD_SHA:-unknown}
        TASKPLANNER_SHADOW_CONTRACT_VERSION: ${TASKPLANNER_SHADOW_CONTRACT_VERSION:-shadow-rfdetr-preflight-v1}
    image: taskplanner-ws:dev
    entrypoint: *taskplanner-workspace-entrypoint
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 45s
    user: "${TASKPLANNER_UID:-1000}:${TASKPLANNER_GID:-1000}"
    working_dir: /workspaces/taskplanner_ws
    network_mode: host
    ipc: host
    volumes:
      - .:/workspaces/taskplanner_ws
      - ${TASKPLANNER_RUN_ROOT:-${HOME}/.local/share/taskplanner/runs}:/taskplanner-runs
      # Explicit operator-triggered ASR recordings are written directly into
      # the host Downloads directory; merely starting ASR does not create files.
      - ${TASKPLANNER_ASR_RECORDING_DIR:-${HOME}/Downloads}:/taskplanner-asr-recordings
      # Follow Ubuntu's selected PipeWire source without exposing the host's
      # complete runtime directory to the sidecar.
      - ${TASKPLANNER_PIPEWIRE_SOCKET:-/run/user/1000/pipewire-0}:/run/taskplanner-pipewire/pipewire-0
    environment:
      XDG_RUNTIME_DIR: /run/taskplanner-pipewire
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_AUTOMATIC_DISCOVERY_RANGE: ${ROS_AUTOMATIC_DISCOVERY_RANGE:-LOCALHOST}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      # This sidecar always runs from the bind-mounted workspace.  Do not
      # inherit a host-shell `file://` path: direct Compose starts otherwise
      # make its ROS node fail before the Live ASR UI can receive a status.
      # Deployments needing a different in-container profile may explicitly
      # set TASKPLANNER_CONTAINER_CYCLONEDDS_URI.
      CYCLONEDDS_URI: ${TASKPLANNER_CONTAINER_CYCLONEDDS_URI:-file:///workspaces/taskplanner_ws/config/cyclonedds_lan.xml}
      TASKPLANNER_RUN_ROOT: /taskplanner-runs
      TASKPLANNER_ASR_OUTPUT_DIR: /taskplanner-asr-recordings
      # Select only a reviewed route.  The node refuses arbitrary service-time
      # server_url overrides even though both endpoints use the same protocol.
      PUZZLE_ASR_ENDPOINT: ${PUZZLE_ASR_ENDPOINT:-cloud}
      PUZZLE_ASR_URL: ${PUZZLE_ASR_URL:-wss://arpa.worker-02.puzzle-ai.com}
      PUZZLE_ASR_LAN_URL: ${PUZZLE_ASR_LAN_URL:-ws://192.168.1.5:1196/}
      # Keep Live's automatic LAN-preferred policy independent of a generic
      # shell setting retained by a prior Debug/replay session.  `auto`
      # continuously monitors the LAN WebSocket and chooses cloud only before
      # a new session when the LAN health lease is stale.
      PUZZLE_ASR_ROUTE_POLICY: ${TASKPLANNER_LIVE_ASR_ROUTE_POLICY:-auto}
      PUZZLE_ASR_LAN_HEALTH_INTERVAL_SEC: ${PUZZLE_ASR_LAN_HEALTH_INTERVAL_SEC:-1.0}
      PUZZLE_ASR_LAN_HEALTH_FAILURE_INTERVAL_SEC: ${PUZZLE_ASR_LAN_HEALTH_FAILURE_INTERVAL_SEC:-0.5}
      PUZZLE_ASR_LAN_HEALTH_TIMEOUT_SEC: ${PUZZLE_ASR_LAN_HEALTH_TIMEOUT_SEC:-0.5}
      PUZZLE_ASR_LAN_HEALTH_STALE_AFTER_SEC: ${PUZZLE_ASR_LAN_HEALTH_STALE_AFTER_SEC:-2.0}
      # Keep one persistent ASR WebSocket by default. Enable only to compare
      # server-final rollover behavior after restarting the ASR sidecar.
      TASKPLANNER_ASR_ROLLOVER_AFTER_FINAL: ${TASKPLANNER_ASR_ROLLOVER_AFTER_FINAL:-false}
      # Live command admission consumes final ASR envelopes, not a raw String.
      # Debug/replay keeps its explicit sentence_text compatibility mode.
      TASKPLANNER_ASR_OUTPUT_MODE: ${TASKPLANNER_ASR_OUTPUT_MODE:-typed_utterance}
      TASKPLANNER_ASR_UTTERANCE_TOPIC: ${ASR_UTTERANCE_TOPIC:-/sensors/surgeon/utterance}
      SENTENCE_INPUT_TOPIC: ${SENTENCE_INPUT_TOPIC:-/sensors/surgeon/sentence}
      TASKPLANNER_ASR_CAPTURE_LOCK: ${TASKPLANNER_ASR_CAPTURE_LOCK:-/taskplanner-runs/asr/microphone.lock}
    healthcheck:
      # Process liveness is insufficient: wait until the ROS node advertises
      # its transient-local status publisher on the runtime DDS graph.
      test:
        - CMD-SHELL
        - >-
          bash -lc 'source /opt/ros/jazzy/setup.bash &&
          source /opt/btops_ws/install/setup.bash &&
          source /workspaces/taskplanner_ws/install/docker/setup.bash &&
          ros2 topic info --no-daemon --spin-time 1.5 --verbose
          /input/asr/runtime_status | grep -q "Node name: taskplanner_asr"'
      interval: 5s
      start_interval: 1s
      timeout: 6s
      retries: 60
      start_period: 10s
    command: >
      bash -lc "if [ ! -f install/docker/setup.bash ] || [ ! -x install/docker/integration_debug/lib/integration_debug/operational_asr_node ]; then
        echo 'Taskplanner operational ASR install is missing or stale; rerun launcher with --build' >&2;
        exit 2;
      fi &&
      source install/docker/setup.bash &&
      exec /workspaces/taskplanner_ws/install/docker/integration_debug/lib/integration_debug/operational_asr_node"

  taskplanner-tts:
    profiles:
      # This is a dedicated Live audio owner. The launcher selects the `ops`
      # profile only to keep it isolated from the split ROS-owner profile.
      - ops
    build:
      context: .
      dockerfile: docker/tts-runtime/Dockerfile
    image: taskplanner-tts:0.1.0
    entrypoint: *taskplanner-workspace-entrypoint
    # Live startup explicitly owns this sidecar. It does not resurrect on its
    # own after a host reboot, and it never gates the command/runtime owners.
    restart: "no"
    stop_signal: SIGINT
    stop_grace_period: 20s
    user: "${TASKPLANNER_UID:-1000}:${TASKPLANNER_GID:-1000}"
    working_dir: /workspaces/taskplanner_ws
    network_mode: host
    ipc: host
    volumes:
      - .:/workspaces/taskplanner_ws
      - ${TASKPLANNER_TTS_MODEL_DIR:-../supertonic_taskplanner_benchmark/model-sdk-1.3.1}:/models/supertonic-3:ro
      - ${TASKPLANNER_TTS_STATE_DIR:-${HOME}/.local/state/taskplanner/tts_runtime}:/taskplanner-tts-state
      - ${TASKPLANNER_TTS_CACHE_DIR:-${HOME}/.cache/taskplanner/tts_runtime}:/taskplanner-tts-cache
      # Follow Ubuntu's currently selected speaker. No raw ALSA device or
      # hard-coded HDMI node is granted to the sidecar.
      - ${TASKPLANNER_PIPEWIRE_SOCKET:-/run/user/1000/pipewire-0}:/run/taskplanner-pipewire/pipewire-0
    environment:
      XDG_RUNTIME_DIR: /run/taskplanner-pipewire
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_AUTOMATIC_DISCOVERY_RANGE: ${ROS_AUTOMATIC_DISCOVERY_RANGE:-LOCALHOST}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      CYCLONEDDS_URI: ${TASKPLANNER_CONTAINER_CYCLONEDDS_URI:-file:///workspaces/taskplanner_ws/config/cyclonedds_lan.xml}
      TASKPLANNER_TTS_SYNTH_PYTHON: /opt/taskplanner-tts-venv/bin/python
      TASKPLANNER_TTS_MODEL_IDENTITY: ${TASKPLANNER_TTS_MODEL_IDENTITY:-supertonic-3:model-sdk-1.3.1:724fb5abbf5502583fb520898d45929e62f02c0b}
      TASKPLANNER_TTS_VOICE_ID: ${TASKPLANNER_TTS_VOICE_ID:-F1}
      TASKPLANNER_TTS_LANGUAGE: ${TASKPLANNER_TTS_LANGUAGE:-ko}
      TASKPLANNER_TTS_STEPS: ${TASKPLANNER_TTS_STEPS:-8}
      TASKPLANNER_TTS_PREWARM_STEPS: ${TASKPLANNER_TTS_PREWARM_STEPS:-100}
      TASKPLANNER_TTS_SPEED: ${TASKPLANNER_TTS_SPEED:-1.05}
      TASKPLANNER_TTS_SILENCE_DURATION: ${TASKPLANNER_TTS_SILENCE_DURATION:-0.3}
      TASKPLANNER_TTS_OUTPUT_TARGET: ${TASKPLANNER_TTS_OUTPUT_TARGET:-}
      TASKPLANNER_TTS_SYNTHESIS_TIMEOUT_SEC: ${TASKPLANNER_TTS_SYNTHESIS_TIMEOUT_SEC:-120.0}
      TASKPLANNER_TTS_WAIT_TIMEOUT_SEC: ${TASKPLANNER_TTS_WAIT_TIMEOUT_SEC:-120.0}
      TASKPLANNER_TTS_GATEWAY_INFO_TIMEOUT_SEC: ${TASKPLANNER_TTS_GATEWAY_INFO_TIMEOUT_SEC:-3.0}
      TASKPLANNER_TTS_ENABLE_VLM_FREE_SPEECH: ${TASKPLANNER_TTS_ENABLE_VLM_FREE_SPEECH:-false}
      # Optional comma-separated ``instrument=spoken Korean name`` overrides.
      # The TTS owner applies them without changing scenario or command logic.
      TASKPLANNER_TTS_TOOL_ALIASES: ${TASKPLANNER_TTS_TOOL_ALIASES:-}
    healthcheck:
      # The ACK publisher is created only after both reviewed phrases complete
      # a real Supertonic prewarm (or validate as cache hits), so endpoint
      # discovery proves model/cache readiness as well as ROS presence.
      test:
        - CMD-SHELL
        - >-
          bash -lc 'source /opt/ros/jazzy/setup.bash &&
          source /opt/btops_ws/install/setup.bash &&
          source /workspaces/taskplanner_ws/install/docker/setup.bash &&
          ros2 topic info --no-daemon --spin-time 1.5 --verbose
          /tts/playback_status | grep -q "Node name: tts_runtime"'
      interval: 5s
      start_interval: 1s
      timeout: 6s
      retries: 60
      start_period: 5s
    command: >
      bash -lc "if [ ! -f install/docker/setup.bash ] || [ ! -x install/docker/tts_runtime/lib/tts_runtime/tts_runtime_node ]; then
        echo 'Taskplanner TTS install is missing or stale; rerun launcher with --build' >&2;
        exit 2;
      fi &&
      source /opt/ros/jazzy/setup.bash &&
      source /opt/btops_ws/install/setup.bash &&
      source install/docker/setup.bash &&
      exec ros2 run tts_runtime tts_runtime_node --ros-args
      -p input_topic:=/vlm/humanoid_reply
      -p database_path:=/taskplanner-tts-state/playback.sqlite3
      -p cache_dir:=/taskplanner-tts-cache/wav
      -p model_dir:=/models/supertonic-3
      -p model_identity:=$${TASKPLANNER_TTS_MODEL_IDENTITY}
      -p synth_python:=$${TASKPLANNER_TTS_SYNTH_PYTHON}
      -p voice_id:=$${TASKPLANNER_TTS_VOICE_ID}
      -p language:=$${TASKPLANNER_TTS_LANGUAGE}
      -p steps:=$${TASKPLANNER_TTS_STEPS}
      -p prewarm_steps:=$${TASKPLANNER_TTS_PREWARM_STEPS}
      -p speed:=$${TASKPLANNER_TTS_SPEED}
      -p silence_duration:=$${TASKPLANNER_TTS_SILENCE_DURATION}
      $${TASKPLANNER_TTS_OUTPUT_TARGET:+-p output_target:=$${TASKPLANNER_TTS_OUTPUT_TARGET}}
      -p synthesis_timeout_sec:=$${TASKPLANNER_TTS_SYNTHESIS_TIMEOUT_SEC}
      -p waiting_timeout_sec:=$${TASKPLANNER_TTS_WAIT_TIMEOUT_SEC}
      -p gateway_info_timeout_sec:=$${TASKPLANNER_TTS_GATEWAY_INFO_TIMEOUT_SEC}
      -p enable_vlm_free_speech:=$${TASKPLANNER_TTS_ENABLE_VLM_FREE_SPEECH}"

  # Canonical modular runtime. These services are started explicitly as one
  # mode-owned set by scripts/taskplanner; the profile alone never auto-starts
  # them. Each service shares the verified overlay but owns one ROS node lane,
  # so source-only changes can be activated with a scoped owner restart.
  taskplanner-state-core:
    <<: *taskplanner-owner-base
    profiles: [owners]
    environment:
      <<: [*taskplanner-operational-environment, *taskplanner-owner-environment]
      TASKPLANNER_OWNER_LAUNCH: taskplanner_state_core.launch.py
    command: *taskplanner-owner-command

  taskplanner-command:
    <<: *taskplanner-owner-base
    profiles: [owners]
    environment:
      <<: [*taskplanner-operational-environment, *taskplanner-owner-environment]
      TASKPLANNER_OWNER_LAUNCH: taskplanner_command.launch.py
    command: *taskplanner-owner-command

  taskplanner-tool-state:
    <<: *taskplanner-owner-base
    profiles: [owners]
    environment:
      <<: [*taskplanner-operational-environment, *taskplanner-owner-environment]
      TASKPLANNER_OWNER_LAUNCH: taskplanner_tool_state.launch.py
    command: *taskplanner-owner-command

  taskplanner-perception:
    <<: *taskplanner-owner-base
    profiles: [owners]
    # This is the only split owner that needs perception credentials and the
    # VLM/TTS reply outbox.  Keeping both off command, state, and browser
    # owners makes a perception/VLM experiment independently restartable.
    volumes:
      - .:/workspaces/taskplanner_ws:ro
      - ${PNU_SECRET_ROOT:-${HOME}/.config/taskplanner/perception}:/run/taskplanner/perception:ro
      - ${TASKPLANNER_TTS_STATE_DIR:-${HOME}/.local/state/taskplanner/tts_runtime}:/taskplanner-tts-state
    environment:
      <<: [*taskplanner-operational-environment, *taskplanner-owner-environment]
      TASKPLANNER_OWNER_LAUNCH: taskplanner_perception.launch.py
    command: *taskplanner-owner-command

  # This tiny projection consumes the already-published external 1.7 CAM4
  # typed observations.  It intentionally has no VLM credentials, model
  # outbox, local detector, or ScenarioStore dependency, so changing it can
  # restart one owner without recreating the loaded VLM process.
  taskplanner-cam4-mayo:
    <<: *taskplanner-owner-base
    profiles: [owners]
    environment:
      <<: [*taskplanner-operational-environment, *taskplanner-owner-environment]
      TASKPLANNER_OWNER_LAUNCH: taskplanner_cam4_mayo.launch.py
    command: *taskplanner-owner-command

  taskplanner-projection:
    <<: *taskplanner-owner-base
    profiles: [owners]
    environment:
      <<: [*taskplanner-operational-environment, *taskplanner-owner-environment]
      TASKPLANNER_OWNER_LAUNCH: taskplanner_projection.launch.py
    command: *taskplanner-owner-command

  taskplanner-execution:
    <<: *taskplanner-owner-base
    profiles: [owners]
    # Route selection and in-flight ledgers belong solely to execution.  No
    # other resident owner needs write access to this state directory.
    volumes:
      - .:/workspaces/taskplanner_ws:ro
      - ${TASKPLANNER_EXECUTION_STATE_DIR:-${HOME}/.local/state/taskplanner/execution}:/taskplanner-execution-state
    environment:
      <<: [*taskplanner-operational-environment, *taskplanner-owner-environment]
      TASKPLANNER_OWNER_LAUNCH: taskplanner_execution.launch.py
    command: *taskplanner-owner-command

  taskplanner-operator-bridge:
    <<: *taskplanner-owner-base
    profiles: [owners]
    environment:
      <<: [*taskplanner-operational-environment, *taskplanner-owner-environment]
      TASKPLANNER_OWNER_LAUNCH: taskplanner_operator_bridge.launch.py
    command: *taskplanner-owner-command

  taskplanner-scenario:
    <<: *taskplanner-owner-base
    profiles: [owners]
    volumes:
      - .:/workspaces/taskplanner_ws:ro
      - ${TASKPLANNER_SCENARIO_STATE_DIR:-${HOME}/.local/state/taskplanner/scenario}:/taskplanner-scenario-state
    environment:
      <<: [*taskplanner-operational-environment, *taskplanner-owner-environment]
      TASKPLANNER_OWNER_LAUNCH: taskplanner_scenario.launch.py
      TASKPLANNER_SCENARIO_SELECTION_STATE_PATH: /taskplanner-scenario-state/selected_bundle.json
    command: *taskplanner-owner-command

  taskplanner-simulation-input:
    <<: *taskplanner-owner-base
    profiles: [owners]
    environment:
      <<: [*taskplanner-operational-environment, *taskplanner-owner-environment]
      TASKPLANNER_OWNER_LAUNCH: taskplanner_simulation_input.launch.py
    command: *taskplanner-owner-command

  # This observer has no scenario, controller, model, microphone, or browser
  # authority. It stays idle until its explicit ROS service starts a local
  # rosbag2 process, then writes only to its private host-owned MCAP directory.
  taskplanner-rosbag-recorder:
    <<: *taskplanner-owner-base
    profiles: [owners]
    stop_grace_period: 30s
    volumes:
      - .:/workspaces/taskplanner_ws:ro
      - ${TASKPLANNER_ROSBAG_STATE_DIR:-${HOME}/.local/state/taskplanner/rosbag2}:/taskplanner-rosbags
    environment:
      <<: *taskplanner-owner-environment
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_AUTOMATIC_DISCOVERY_RANGE: ${ROS_AUTOMATIC_DISCOVERY_RANGE:-LOCALHOST}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      CYCLONEDDS_URI: ${TASKPLANNER_CONTAINER_CYCLONEDDS_URI:-file:///workspaces/taskplanner_ws/config/cyclonedds_lan.xml}
      TASKPLANNER_RUNTIME_MODE: ${TASKPLANNER_RUNTIME_MODE:-live}
      TASKPLANNER_OWNER_LAUNCH: taskplanner_rosbag_recorder.launch.py
      TASKPLANNER_ROSBAG_OUTPUT_DIR: /taskplanner-rosbags
      TASKPLANNER_ROSBAG_HOST_OUTPUT_DIR: ${TASKPLANNER_ROSBAG_STATE_DIR:-${HOME}/.local/state/taskplanner/rosbag2}
      TASKPLANNER_ROSBAG_MIN_FREE_BYTES: ${TASKPLANNER_ROSBAG_MIN_FREE_BYTES:-21474836480}
      TASKPLANNER_ROSBAG_MAX_BAG_BYTES: ${TASKPLANNER_ROSBAG_MAX_BAG_BYTES:-17179869184}
      TASKPLANNER_ROSBAG_MAX_CACHE_BYTES: ${TASKPLANNER_ROSBAG_MAX_CACHE_BYTES:-536870912}
    command: *taskplanner-owner-command

  # Always-on in Live, but isolated from Debug and synthetic modes.  This
  # owner receives only ROS discovery, one private output directory, and one
  # read-only API-key file; model, microphone, controller, and PNU credentials
  # are deliberately outside its environment and mount surface.
  taskplanner-surgery-record:
    <<: *taskplanner-owner-base
    profiles: [owners]
    stop_grace_period: 45s
    volumes:
      - .:/workspaces/taskplanner_ws:ro
      - ${TASKPLANNER_SURGERY_RECORD_STATE_DIR:-${HOME}/.local/state/taskplanner/surgery-record}:/taskplanner-surgery-record
      - ${PUZZLE_SURGERY_RECORD_API_KEY_FILE:-${HOME}/.config/taskplanner/secrets/puzzle-surgery-record-api-key}:/run/taskplanner-secrets/puzzle-surgery-record-api-key:ro
    environment:
      <<: *taskplanner-owner-environment
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_AUTOMATIC_DISCOVERY_RANGE: ${ROS_AUTOMATIC_DISCOVERY_RANGE:-LOCALHOST}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      CYCLONEDDS_URI: ${TASKPLANNER_CONTAINER_CYCLONEDDS_URI:-file:///workspaces/taskplanner_ws/config/cyclonedds_lan.xml}
      TASKPLANNER_RUNTIME_MODE: ${TASKPLANNER_RUNTIME_MODE:-live}
      TASKPLANNER_OWNER_LAUNCH: taskplanner_surgery_record.launch.py
      TASKPLANNER_SURGERY_RECORD_OUTPUT_DIR: /taskplanner-surgery-record/records
      TASKPLANNER_SURGERY_RECORD_INPUT_DIR: ${TASKPLANNER_SURGERY_RECORD_INPUT_DIR:-/workspaces/taskplanner_ws/reports/surgery_records/0704_6_17_clinical_prompt_v1}
      TASKPLANNER_SURGERY_RECORD_PROCEDURES: ${TASKPLANNER_SURGERY_RECORD_PROCEDURES:-thyroidectomy,thyroidectomy_demo}
      PUZZLE_SURGERY_RECORD_ENDPOINT: ${PUZZLE_SURGERY_RECORD_ENDPOINT:-https://192.168.1.5:6627/api/v1/surgery/img_texts}
      PUZZLE_SURGERY_RECORD_API_KEY_FILE: /run/taskplanner-secrets/puzzle-surgery-record-api-key
      # Trust only the Puzzle private CA for this least-privilege HTTPS owner.
      # Do not disable certificate or hostname verification for the LAN API.
      SSL_CERT_FILE: /workspaces/taskplanner_ws/config/puzzle_surgery_record_root_ca.pem
      PUZZLE_SURGERY_RECORD_ROOM_NAME: ${PUZZLE_SURGERY_RECORD_ROOM_NAME:-Preclinical Center}
      PUZZLE_SURGERY_RECORD_TIMEOUT_SEC: ${PUZZLE_SURGERY_RECORD_TIMEOUT_SEC:-35.0}
      PUZZLE_SURGERY_RECORD_SHUTDOWN_WAIT_SEC: ${PUZZLE_SURGERY_RECORD_SHUTDOWN_WAIT_SEC:-40.0}
    command: *taskplanner-owner-command

  # The read-only Debug observer stays separate from all Debug write and
  # optional-device capabilities.  It has only source/install read access and
  # a small run-root for bounded local status/event records; PipeWire, record
  # API keys, PNU secrets, and VLM/NInfer settings are intentionally absent.
  taskplanner-debug-observer:
    <<: *taskplanner-owner-base
    profiles: [owners]
    volumes:
      - .:/workspaces/taskplanner_ws:ro
      - ${TASKPLANNER_RUN_ROOT:-${HOME}/.local/share/taskplanner/runs}:/taskplanner-runs
    environment:
      <<: *taskplanner-owner-environment
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_AUTOMATIC_DISCOVERY_RANGE: ${ROS_AUTOMATIC_DISCOVERY_RANGE:-SUBNET}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      CYCLONEDDS_URI: ${TASKPLANNER_CONTAINER_CYCLONEDDS_URI-${CYCLONEDDS_URI:-}}
      TASKPLANNER_RUNTIME_MODE: ${TASKPLANNER_RUNTIME_MODE:-debug}
      TASKPLANNER_OWNER_LAUNCH: taskplanner_debug_observer.launch.py
      TASKPLANNER_RUN_ROOT: /taskplanner-runs
      TASKPLANNER_DEBUG_NETWORK_SETTINGS: ${TASKPLANNER_DEBUG_NETWORK_SETTINGS:-/taskplanner-runs/debug/network-settings.json}
      TASKPLANNER_DEBUG_NETWORK_INTERFACE: ${TASKPLANNER_DEBUG_NETWORK_INTERFACE:-}
      TASKPLANNER_DEBUG_LOCK_TO_RUNTIME_NETWORK: ${TASKPLANNER_DEBUG_LOCK_TO_RUNTIME_NETWORK:-false}
      TASKPLANNER_DEBUG_ROBOT_ENDPOINT_SOURCE: ${TASKPLANNER_DEBUG_ROBOT_ENDPOINT_SOURCE:-virtual}
      ROSBRIDGE_DEBUG_PORT: ${ROSBRIDGE_DEBUG_UPSTREAM_PORT:-9093}
      ROSBRIDGE_ADDRESS: 127.0.0.1
      ROSBRIDGE_SERVICE_TIMEOUT: ${ROSBRIDGE_SERVICE_TIMEOUT:-30.0}
      TASKPLANNER_DEBUG_ROSBRIDGE_EXECUTABLE: ${TASKPLANNER_DEBUG_ROSBRIDGE_EXECUTABLE:-secure_debug_rosbridge}
    command: >
      bash -lc "if [ ! -f install/docker/setup.bash ] || [ ! -e install/docker/bringup/share/bringup/launch/taskplanner_debug_observer.launch.py ] || [ ! -x install/docker/integration_debug/lib/integration_debug/integration_debug_observer ]; then
        echo 'Taskplanner Debug observer install is missing; run the scoped observer build' >&2;
        exit 2;
      fi &&
      source /opt/ros/jazzy/setup.bash &&
      source /opt/btops_ws/install/setup.bash &&
      source install/docker/setup.bash &&
      exec python3 scripts/run_integration_debug.py
      --settings $${TASKPLANNER_DEBUG_NETWORK_SETTINGS}
      -- ros2 launch bringup taskplanner_debug_observer.launch.py
      rosbridge_port:=$${ROSBRIDGE_DEBUG_PORT}
      rosbridge_address:=$${ROSBRIDGE_ADDRESS}
      rosbridge_service_timeout:=$${ROSBRIDGE_SERVICE_TIMEOUT}
      rosbridge_executable:=$${TASKPLANNER_DEBUG_ROSBRIDGE_EXECUTABLE}
      run_root:=$${TASKPLANNER_RUN_ROOT}"

  # Explicit Debug writes are a separate process.  It deliberately has no
  # browser bridge, microphone, PNU/VLM client, record uploader, or privileged
  # mount; the node's paused/stopped and arm/single-flight rules remain the
  # admission boundary for the endpoint it calls.
  taskplanner-debug-control:
    <<: *taskplanner-owner-base
    profiles: [owners]
    volumes:
      - .:/workspaces/taskplanner_ws:ro
      - ${TASKPLANNER_RUN_ROOT:-${HOME}/.local/share/taskplanner/runs}:/taskplanner-runs
    environment:
      <<: *taskplanner-owner-environment
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_AUTOMATIC_DISCOVERY_RANGE: ${ROS_AUTOMATIC_DISCOVERY_RANGE:-SUBNET}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      CYCLONEDDS_URI: ${TASKPLANNER_CONTAINER_CYCLONEDDS_URI-${CYCLONEDDS_URI:-}}
      TASKPLANNER_RUNTIME_MODE: ${TASKPLANNER_RUNTIME_MODE:-debug}
      TASKPLANNER_OWNER_LAUNCH: taskplanner_debug_control.launch.py
      TASKPLANNER_RUN_ROOT: /taskplanner-runs
      TASKPLANNER_DEBUG_ROBOT_ENDPOINT_SOURCE: ${TASKPLANNER_DEBUG_ROBOT_ENDPOINT_SOURCE:-virtual}
      TASKPLANNER_DEBUG_ENABLE_VIRTUAL_ROBOT: ${TASKPLANNER_DEBUG_ENABLE_VIRTUAL_ROBOT:-true}
    command: >
      bash -lc "if [ ! -f install/docker/setup.bash ] || [ ! -e install/docker/bringup/share/bringup/launch/taskplanner_debug_control.launch.py ] || [ ! -x install/docker/integration_debug/lib/integration_debug/integration_debug_control ]; then
        echo 'Taskplanner Debug control install is missing; run the scoped control build' >&2;
        exit 2;
      fi &&
      source /opt/ros/jazzy/setup.bash &&
      source /opt/btops_ws/install/setup.bash &&
      source install/docker/setup.bash &&
      exec ros2 launch bringup taskplanner_debug_control.launch.py
      robot_endpoint_source:=$${TASKPLANNER_DEBUG_ROBOT_ENDPOINT_SOURCE}
      virtual_robot_enabled:=$${TASKPLANNER_DEBUG_ENABLE_VIRTUAL_ROBOT}
      run_root:=$${TASKPLANNER_RUN_ROOT}"

  # The virtual robot is deliberately its own Debug-only owner.  It has no
  # browser bridge, device mount, writable state, or model/network secret;
  # the registry decides whether it is included for a virtual Debug session.
  taskplanner-debug-virtual:
    <<: *taskplanner-owner-base
    profiles: [owners]
    environment:
      <<: *taskplanner-owner-environment
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_AUTOMATIC_DISCOVERY_RANGE: ${ROS_AUTOMATIC_DISCOVERY_RANGE:-SUBNET}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      CYCLONEDDS_URI: ${TASKPLANNER_CONTAINER_CYCLONEDDS_URI-${CYCLONEDDS_URI:-}}
      TASKPLANNER_RUNTIME_MODE: ${TASKPLANNER_RUNTIME_MODE:-debug}
      TASKPLANNER_OWNER_LAUNCH: taskplanner_debug_virtual.launch.py
    command: *taskplanner-owner-command

  # SurgiMate remains a separately built, browser-only application.  The
  # Taskplanner owner plane only starts/stops this one static server; it never
  # imports its source or grants it ROS, control, model, or credential access.
  taskplanner-surgimate:
    profiles: [owners]
    image: taskplanner-ws:dev
    entrypoint: []
    restart: "no"
    user: "${TASKPLANNER_UID:-1000}:${TASKPLANNER_GID:-1000}"
    working_dir: /opt/surgimate
    network_mode: host
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - ../modules/surgimate_0820:/opt/surgimate:ro
    environment:
      HOST: 127.0.0.1
      PORT: "5174"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const http=require("node:http"); const request=http.get("http://127.0.0.1:"+(process.env.PORT||"5174")+"/",(response)=>{response.resume();process.exit(response.statusCode===200?0:1)}); request.setTimeout(2000,()=>{request.destroy();process.exit(1)}); request.on("error",()=>process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    command: ["node", "server.mjs"]

  public-rosbridge:
    profiles:
      - live
      - llm-surgeon
      - replay
    image: taskplanner-ws:dev
    entrypoint: *taskplanner-workspace-entrypoint
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 10s
    user: "${TASKPLANNER_UID:-1000}:${TASKPLANNER_GID:-1000}"
    working_dir: /workspaces/taskplanner_ws
    network_mode: host
    ipc: host
    read_only: true
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - .:/workspaces/taskplanner_ws:ro
    environment:
      # Replay deliberately runs in an isolated DDS domain. The mode env maps
      # this sidecar onto that same domain without widening native DDS discovery.
      ROS_DOMAIN_ID: ${PUBLIC_ROS_DOMAIN_ID:-${ROS_DOMAIN_ID:-0}}
      ROS_AUTOMATIC_DISCOVERY_RANGE: ${PUBLIC_ROS_AUTOMATIC_DISCOVERY_RANGE:-${ROS_AUTOMATIC_DISCOVERY_RANGE:-LOCALHOST}}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      # The non-colon fallback preserves an explicitly empty replay value so a
      # host LAN Cyclone profile cannot leak into the isolated shadow graph.
      CYCLONEDDS_URI: ${PUBLIC_CYCLONEDDS_URI-${TASKPLANNER_CONTAINER_CYCLONEDDS_URI-${CYCLONEDDS_URI:-}}}
      ROS_LOG_DIR: /tmp/ros-logs
      PUBLIC_ROSBRIDGE_ALLOWED_ORIGINS: ${PUBLIC_ROSBRIDGE_ALLOWED_ORIGINS:-}
      PUBLIC_ROSBRIDGE_PORT: ${PUBLIC_ROSBRIDGE_PORT:-9092}
      ENABLE_PUBLIC_ROSBRIDGE: ${ENABLE_PUBLIC_ROSBRIDGE:-true}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 /workspaces/taskplanner_ws/scripts/taskplanner_public_bridge_health.py
          --port "$${PUBLIC_ROSBRIDGE_PORT}" --timeout 1
      interval: 5s
      start_interval: 1s
      timeout: 2s
      retries: 60
      start_period: 5s
    command: >
      bash -lc "for attempt in $$(seq 1 150); do
        if [ -f install/docker/setup.bash ]; then
          source install/docker/setup.bash;
          if [ -x install/docker/surgical_interop_gateway/lib/surgical_interop_gateway/public_rosbridge ]; then
            exec /workspaces/taskplanner_ws/install/docker/surgical_interop_gateway/lib/surgical_interop_gateway/public_rosbridge --port $${PUBLIC_ROSBRIDGE_PORT} --address 127.0.0.1 --websocket_ping_interval 20.0 --websocket_ping_timeout 30.0;
          fi;
        fi;
        sleep 2;
      done;
      echo 'public_rosbridge executable unavailable after 300 seconds' >&2;
      exit 2"

  # SurgiMate remains a read-only public ROS projection on 9092.  Its UI
  # replay journal therefore uses this distinct loopback-only bridge, which
  # can publish one bounded String audit topic and nothing operational.
  rosbag-ui-audit-bridge:
    profiles:
      - live
      - replay
    image: taskplanner-ws:dev
    entrypoint: *taskplanner-workspace-entrypoint
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 10s
    user: "${TASKPLANNER_UID:-1000}:${TASKPLANNER_GID:-1000}"
    working_dir: /workspaces/taskplanner_ws
    network_mode: host
    ipc: host
    read_only: true
    mem_limit: 192m
    memswap_limit: 192m
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - .:/workspaces/taskplanner_ws:ro
    environment:
      ROS_DOMAIN_ID: ${ROSBAG_UI_AUDIT_ROS_DOMAIN_ID:-${ROS_DOMAIN_ID:-0}}
      ROS_AUTOMATIC_DISCOVERY_RANGE: ${ROSBAG_UI_AUDIT_ROS_AUTOMATIC_DISCOVERY_RANGE:-${ROS_AUTOMATIC_DISCOVERY_RANGE:-LOCALHOST}}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      CYCLONEDDS_URI: ${ROSBAG_UI_AUDIT_CYCLONEDDS_URI-${TASKPLANNER_CONTAINER_CYCLONEDDS_URI-${CYCLONEDDS_URI:-}}}
      ROS_LOG_DIR: /tmp/ros-logs
      ROSBAG_UI_AUDIT_ALLOWED_ORIGINS: "${ROSBAG_UI_AUDIT_ALLOWED_ORIGINS:-http://127.0.0.1:5174,http://localhost:5174}"
      ROSBAG_UI_AUDIT_PORT: ${ROSBAG_UI_AUDIT_PORT:-9096}
      ENABLE_ROSBAG_UI_AUDIT_BRIDGE: ${ENABLE_ROSBAG_UI_AUDIT_BRIDGE:-true}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 /workspaces/taskplanner_ws/scripts/taskplanner_public_bridge_health.py
          --port "$${ROSBAG_UI_AUDIT_PORT}" --origin http://127.0.0.1:5174
          --contract rosbag-ui-audit-v1 --timeout 1
      interval: 5s
      start_interval: 1s
      timeout: 2s
      retries: 60
      start_period: 5s
    command: >
      bash -lc "for attempt in $$(seq 1 150); do
        if [ -f install/docker/setup.bash ]; then
          source install/docker/setup.bash;
          if [ -x install/docker/surgical_interop_gateway/lib/surgical_interop_gateway/rosbag_ui_audit_rosbridge ]; then
            exec /workspaces/taskplanner_ws/install/docker/surgical_interop_gateway/lib/surgical_interop_gateway/rosbag_ui_audit_rosbridge --port $${ROSBAG_UI_AUDIT_PORT} --address 127.0.0.1 --websocket_ping_interval 20.0 --websocket_ping_timeout 30.0;
          fi;
        fi;
        sleep 2;
      done;
      echo 'rosbag_ui_audit_rosbridge executable unavailable after 300 seconds' >&2;
      exit 2"

  # Browser camera media is isolated from the full-control operator rosbridge.
  # This loopback-only sidecar admits exactly the five existing Live compressed
  # source topics and coalesces each topic to its latest pending frame.  It
  # never decodes/resizes/transcodes source JPEG bytes and is deliberately not
  # routed through the public 9092 LAN proxy.
  local-media-rosbridge:
    profiles:
      - live
    image: taskplanner-ws:dev
    entrypoint: *taskplanner-workspace-entrypoint
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 10s
    user: "${TASKPLANNER_UID:-1000}:${TASKPLANNER_GID:-1000}"
    working_dir: /workspaces/taskplanner_ws
    network_mode: host
    ipc: host
    read_only: true
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - .:/workspaces/taskplanner_ws:ro
    environment:
      ROS_DOMAIN_ID: ${LOCAL_MEDIA_ROS_DOMAIN_ID:-${ROS_DOMAIN_ID:-0}}
      ROS_AUTOMATIC_DISCOVERY_RANGE: ${LOCAL_MEDIA_ROS_AUTOMATIC_DISCOVERY_RANGE:-${ROS_AUTOMATIC_DISCOVERY_RANGE:-LOCALHOST}}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      CYCLONEDDS_URI: ${LOCAL_MEDIA_CYCLONEDDS_URI-${TASKPLANNER_CONTAINER_CYCLONEDDS_URI-${CYCLONEDDS_URI:-}}}
      ROS_LOG_DIR: /tmp/ros-logs
      # `public_rosbridge` reads this name; it is scoped to this container and
      # only permits the local 4173 UI origins by default.
      PUBLIC_ROSBRIDGE_ALLOWED_ORIGINS: "${LOCAL_MEDIA_ROSBRIDGE_ALLOWED_ORIGINS:-http://127.0.0.1:4173,http://localhost:4173}"
      PUBLIC_ROSBRIDGE_PORT: ${LOCAL_MEDIA_ROSBRIDGE_PORT:-9095}
      TASKPLANNER_BOUNDED_ROSBRIDGE_PROFILE: local-media
      ENABLE_LOCAL_MEDIA_ROSBRIDGE: ${ENABLE_LOCAL_MEDIA_ROSBRIDGE:-true}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 /workspaces/taskplanner_ws/scripts/taskplanner_public_bridge_health.py
          --port "$${PUBLIC_ROSBRIDGE_PORT}" --contract local-media-subscribe-v1 --timeout 1
      interval: 5s
      start_interval: 1s
      timeout: 2s
      retries: 60
      start_period: 5s
    command: >
      bash -lc "for attempt in $$(seq 1 150); do
        if [ -f install/docker/setup.bash ]; then
          source install/docker/setup.bash;
          if [ -x install/docker/surgical_interop_gateway/lib/surgical_interop_gateway/public_rosbridge ]; then
            exec /workspaces/taskplanner_ws/install/docker/surgical_interop_gateway/lib/surgical_interop_gateway/public_rosbridge --port $${PUBLIC_ROSBRIDGE_PORT} --address 127.0.0.1 --websocket_ping_interval 20.0 --websocket_ping_timeout 30.0;
          fi;
        fi;
        sleep 2;
      done;
      echo 'local media rosbridge executable unavailable after 300 seconds' >&2;
      exit 2"

  multicam-observer:
    profiles:
      - debug
      - ops
    image: taskplanner-ws:dev
    entrypoint: *taskplanner-workspace-entrypoint
    restart: "no"
    stop_signal: SIGINT
    stop_grace_period: 15s
    user: "${TASKPLANNER_UID:-1000}:${TASKPLANNER_GID:-1000}"
    working_dir: /workspaces/taskplanner_ws
    network_mode: host
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    memswap_limit: 512m
    tmpfs:
      - /tmp
    volumes:
      - .:/workspaces/taskplanner_ws:ro
    environment:
      # Multicam capture runs on the facility ROS domain independently of the
      # selected planner/replay domain.  These dedicated variables prevent a
      # mode env file from silently moving the read-only observer elsewhere.
      ROS_DOMAIN_ID: ${MULTICAM_ROS_DOMAIN_ID:-0}
      ROS_AUTOMATIC_DISCOVERY_RANGE: ${MULTICAM_ROS_DISCOVERY_RANGE:-SUBNET}
      RMW_IMPLEMENTATION: ${MULTICAM_RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      CYCLONEDDS_URI: ${MULTICAM_CYCLONEDDS_URI:-file:///workspaces/taskplanner_ws/config/cyclonedds_lan.xml}
      ROS_LOG_DIR: /tmp/ros-logs
      ROSBRIDGE_MULTICAM_PORT: ${ROSBRIDGE_MULTICAM_PORT:-9094}
      ROSBRIDGE_ADDRESS: 127.0.0.1
      ROSBRIDGE_SERVICE_TIMEOUT: ${ROSBRIDGE_MULTICAM_SERVICE_TIMEOUT:-10.0}
    healthcheck:
      # Capture publishers may be absent when the facility cameras are off.
      # Health therefore covers only the read-only bridge process; capture
      # status remains an explicit UI operational state, not a boot gate.
      test:
        - CMD-SHELL
        - >-
          python3 -c 'import os, socket;
          s = socket.create_connection(("127.0.0.1", int(os.environ["ROSBRIDGE_MULTICAM_PORT"])), 1.0);
          s.close()'
      interval: 5s
      timeout: 2s
      retries: 60
      start_period: 5s
    command: >
      bash -lc "if [ ! -f install/docker/setup.bash ] || [ ! -x install/docker/integration_debug/lib/integration_debug/secure_multicam_rosbridge ]; then
        echo 'Multicam observer is missing from install; rerun launcher with --build' >&2;
        exit 2;
      fi &&
      source install/docker/setup.bash &&
      exec ros2 launch integration_debug multicam_observer.launch.py
      rosbridge_port:=$${ROSBRIDGE_MULTICAM_PORT}
      rosbridge_address:=$${ROSBRIDGE_ADDRESS}
      rosbridge_service_timeout:=$${ROSBRIDGE_SERVICE_TIMEOUT}"

  webapp-lan-proxy:
    profiles:
      - ops
    # LAN exposure is optional. The core dashboard stays loopback-only unless
    # the operator explicitly enables the Ops plane.
    image: taskplanner-ws:dev
    entrypoint: []
    restart: "no"
    user: "${TASKPLANNER_UID:-1000}:${TASKPLANNER_GID:-1000}"
    working_dir: /workspaces/taskplanner_ws
    network_mode: host
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - .:/workspaces/taskplanner_ws:ro
    command:
      - python3
      - scripts/taskplanner_debug_lan_proxy.py
      - --bind-address
      - ${TASKPLANNER_WEBAPP_LAN_ADDRESS:-192.168.1.4}
      - --allow-network
      - ${TASKPLANNER_WEBAPP_LAN_NETWORK:-192.168.1.0/24}
      - --route
      - ${WEBAPP_PORT:-4173}=127.0.0.1:${WEBAPP_PORT:-4173}

  integration-debug-lan-proxy:
    profiles:
      # This is the LAN path router for the shared browser surface. It is
      # independent from the integration-debug runtime, so LLM Surgeon keeps
      # the router even though it does not start the Debug observer.
      - debug
      - ops
    image: taskplanner-ws:dev
    entrypoint: []
    restart: "no"
    user: "${TASKPLANNER_UID:-1000}:${TASKPLANNER_GID:-1000}"
    working_dir: /workspaces/taskplanner_ws
    network_mode: host
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - .:/workspaces/taskplanner_ws:ro
    command:
      - python3
      - scripts/taskplanner_debug_lan_proxy.py
      - --interface
      - ${TASKPLANNER_DEBUG_NETWORK_INTERFACE:-enp13s0}
      - --route
      - ${ROSBRIDGE_DEBUG_PORT:-9091}=127.0.0.1:${ROSBRIDGE_DEBUG_UPSTREAM_PORT:-9093}
      # Remote Live browsers use the explicit path chosen in runtimeModes.ts.
      # Keep the generic bridge loopback-only; this LAN proxy admits only the
      # selected wired subnet and forwards the reviewed Live path.
      - --route
      - ${ROSBRIDGE_DEBUG_PORT:-9091}/live=127.0.0.1:${ROSBRIDGE_PORT:-9090}

  public-rosbridge-lan-proxy:
    profiles:
      - ops
    image: taskplanner-ws:dev
    entrypoint: []
    restart: "no"
    user: "${TASKPLANNER_UID:-1000}:${TASKPLANNER_GID:-1000}"
    working_dir: /workspaces/taskplanner_ws
    network_mode: host
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - .:/workspaces/taskplanner_ws:ro
    command:
      - python3
      - scripts/taskplanner_debug_lan_proxy.py
      - --interface
      - ${TASKPLANNER_DEBUG_NETWORK_INTERFACE:-enp13s0}
      - --route
      - ${PUBLIC_ROSBRIDGE_PORT:-9092}=127.0.0.1:${PUBLIC_ROSBRIDGE_PORT:-9092}

  integration-debug-tailscale-proxy:
    profiles:
      - debug
      - ops
    image: taskplanner-ws:dev
    entrypoint: []
    restart: "no"
    user: "${TASKPLANNER_UID:-1000}:${TASKPLANNER_GID:-1000}"
    working_dir: /workspaces/taskplanner_ws
    network_mode: host
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - .:/workspaces/taskplanner_ws:ro
    command:
      - python3
      - scripts/taskplanner_debug_lan_proxy.py
      # Tailscale's localhost gateway DNATs permitted Tailnet TCP to 127.0.0.1.
      # Route that single port by websocket path without opening a new port.
      - --bind-address
      - 127.0.0.1
      - --allow-network
      - 100.64.0.0/10
      - --allow-loopback-clients
      - --route
      - ${ROSBRIDGE_DEBUG_PORT:-9091}=127.0.0.1:${ROSBRIDGE_DEBUG_UPSTREAM_PORT:-9093}
      # The existing Tailnet-permitted port carries each reviewed runtime only
      # on an explicit websocket path. Root traffic remains Debug Mode.
      - --route
      - ${ROSBRIDGE_DEBUG_PORT:-9091}/live=127.0.0.1:${ROSBRIDGE_PORT:-9090}
      - --route
      - ${ROSBRIDGE_DEBUG_PORT:-9091}/llm=127.0.0.1:${ROSBRIDGE_PORT:-9090}
      - --route
      - ${ROSBRIDGE_DEBUG_PORT:-9091}/shadow=127.0.0.1:${ROSBRIDGE_SHADOW_PORT:-9099}
      - --route
      - ${ROSBRIDGE_DEBUG_PORT:-9091}/multicam=127.0.0.1:${ROSBRIDGE_MULTICAM_PORT:-9094}

  webapp:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        btops_ws: ${BTOPS_LOCAL_CONTEXT:-../btops_ws}
      args:
        BTOPS_LOCAL_CONTEXT: ${BTOPS_LOCAL_CONTEXT:-../btops_ws}
        BTOPS_REF: ${BTOPS_REF:-main}
        AUTO_APMS_REPO_URL: ${AUTO_APMS_REPO_URL:-https://github.com/AutoAPMS/auto-apms.git}
        AUTO_APMS_REF: ${AUTO_APMS_REF:-19ac8d558e35f657b8464694c5ddc524c6c31861}
        TASKPLANNER_BUILD_VERSION: ${TASKPLANNER_BUILD_VERSION:-0.1.0-dev}
        TASKPLANNER_BUILD_SHA: ${TASKPLANNER_BUILD_SHA:-unknown}
        TASKPLANNER_SHADOW_CONTRACT_VERSION: ${TASKPLANNER_SHADOW_CONTRACT_VERSION:-shadow-rfdetr-preflight-v1}
    image: taskplanner-ws:dev
    # This service is static Node.js only; bypass the image's ROS entrypoint so
    # a stale or host-built colcon overlay cannot delay or break the dashboard.
    entrypoint: []
    # The dashboard is the reviewed mode-transition surface. Keep it available
    # when Vite exits, while explicit `docker compose stop` still stays stopped.
    restart: unless-stopped
    working_dir: /workspaces/taskplanner_ws/webapp
    # Startup may briefly use root to synchronize the isolated dependency
    # volume. The build and production server drop to the desktop UID below.
    # The Vite server stays loopback-only on the host. Host networking lets its
    # server-side proxy reach the loopback-only runtime-control service without
    # opening that control service on a Docker or Tailnet interface.
    network_mode: host
    volumes:
      - .:/workspaces/taskplanner_ws
      - taskplanner_web_node_modules:/workspaces/taskplanner_ws/webapp/node_modules
      - ${TASKPLANNER_RUNTIME_CONTROL_TOKEN_FILE:-${HOME}/.config/taskplanner/secrets/runtime-control-token}:/run/taskplanner-secrets/runtime-control-token:ro
    environment:
      # The static server has no ROS dependency. Avoid coupling Web startup to
      # the isolated container overlay under install/docker.
      TASKPLANNER_SKIP_WORKSPACE_SETUP: "true"
      TASKPLANNER_RUNTIME_CONTROL_URL: http://127.0.0.1:${TASKPLANNER_RUNTIME_CONTROL_PORT:-8150}
      TASKPLANNER_RUNTIME_CONTROL_TOKEN_FILE: /run/taskplanner-secrets/runtime-control-token
      VITE_ROSBRIDGE_URL: ${VITE_ROSBRIDGE_URL:-}
      VITE_ROSBRIDGE_PORT: ${ROSBRIDGE_PORT:-9090}
      # Runtime status is authoritative. Keep this fallback mode-independent so
      # switching ROS profiles does not restart the dashboard that requested it.
      # A browser with no authoritative status begins on the real external
      # integration surface, not the synthetic LLM demonstration.
      VITE_DEFAULT_RUNTIME_MODE: ${TASKPLANNER_WEBAPP_FALLBACK_MODE:-live}
      VITE_ROSBRIDGE_LIVE_URL: ${VITE_ROSBRIDGE_LIVE_URL:-}
      VITE_ROSBRIDGE_LIVE_PORT: ${ROSBRIDGE_LIVE_PORT:-9090}
      VITE_ROSBRIDGE_LIVE_TAILSCALE_PORT: ${VITE_ROSBRIDGE_LIVE_TAILSCALE_PORT:-9091}
      VITE_ROSBRIDGE_LIVE_TAILSCALE_PATH: ${VITE_ROSBRIDGE_LIVE_TAILSCALE_PATH:-/live}
      VITE_ROSBRIDGE_TAILSCALE_PORT: ${VITE_ROSBRIDGE_TAILSCALE_PORT:-9091}
      VITE_ROSBRIDGE_LLM_TAILSCALE_PATH: ${VITE_ROSBRIDGE_LLM_TAILSCALE_PATH:-/llm}
      VITE_ROSBRIDGE_SHADOW_TAILSCALE_PATH: ${VITE_ROSBRIDGE_SHADOW_TAILSCALE_PATH:-/shadow}
      VITE_ROSBRIDGE_LLM_URL: ${VITE_ROSBRIDGE_LLM_URL:-}
      VITE_ROSBRIDGE_LLM_PORT: ${ROSBRIDGE_LLM_PORT:-9090}
      VITE_ROSBRIDGE_SHADOW_URL: ${VITE_ROSBRIDGE_SHADOW_URL:-}
      VITE_ROSBRIDGE_SHADOW_PORT: ${ROSBRIDGE_SHADOW_PORT:-9099}
      VITE_ROSBRIDGE_DEBUG_URL: ${VITE_ROSBRIDGE_DEBUG_URL:-}
      VITE_ROSBRIDGE_DEBUG_PORT: ${ROSBRIDGE_DEBUG_PORT:-9091}
      VITE_SURGIMATE_URL: ${VITE_SURGIMATE_URL:-}
      VITE_SURGIMATE_PORT: "5174"
      # Camera frames use the dedicated loopback-only bounded media socket;
      # all state/control traffic stays on the normal runtime rosbridge.
      VITE_LIVE_MEDIA_BRIDGE_URL: ${VITE_LIVE_MEDIA_BRIDGE_URL:-}
      VITE_EXTERNAL_CAM1_TOPIC: ${VITE_EXTERNAL_CAM1_TOPIC:-/synced/cam_1/color/image_raw/compressed}
      VITE_EXTERNAL_CAM2_TOPIC: ${VITE_EXTERNAL_CAM2_TOPIC:-/synced/cam_2/color/image_raw/compressed}
      VITE_EXTERNAL_CAM3_OPERATOR_OVERLAY_TOPIC: ${VITE_EXTERNAL_CAM3_OPERATOR_OVERLAY_TOPIC:-/perception/cam_3/overlay/compressed}
      VITE_EXTERNAL_CAM4_OPERATOR_OVERLAY_TOPIC: ${VITE_EXTERNAL_CAM4_OPERATOR_OVERLAY_TOPIC:-/perception/cam_4/overlay/compressed}
      VITE_EXTERNAL_FLIR_TOPIC: ${VITE_EXTERNAL_FLIR_TOPIC:-/synced/flir/color/image_raw/compressed}
      WEBAPP_INSTALL_ON_START: ${WEBAPP_INSTALL_ON_START:-false}
      # Rebuild only when the source fingerprint changes. A normal runtime
      # restart serves the existing dist bundle immediately.
      WEBAPP_BUILD_ON_START: ${WEBAPP_BUILD_ON_START:-false}
    healthcheck:
      # Core health covers the static UI only. Runtime-control reports its own
      # degraded state and does not block dashboard availability.
      test:
        - CMD
        - python3
        - -c
        - >-
          import urllib.request;
          ui=[urllib.request.urlopen('http://127.0.0.1:4173'+path,timeout=2) for path in ('/','/healthz')];
          ui_bodies=[response.read(524289) for response in ui];
          valid_ui=all(response.status == 200 for response in ui) and [response.headers.get_content_type() for response in ui] == ['text/html','application/json'] and all(0 < len(body) <= 524288 for body in ui_bodies) and b'id="root"' in ui_bodies[0];
          raise SystemExit(0 if valid_ui else 1)
      interval: 5s
      start_interval: 1s
      timeout: 3s
      retries: 12
      start_period: 45s
    command:
      - bash
      - /workspaces/taskplanner_ws/webapp/scripts/start-production.sh

volumes:
  taskplanner_web_node_modules:
