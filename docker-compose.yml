        - python
        - -c
        - "import json,os,urllib.request; h=os.environ.get('PNU_HOST','127.0.0.1'); h='127.0.0.1' if h in {'0.0.0.0','::'} else h; h=f'[{h}]' if ':' in h and not h.startswith('[') else h; p=json.load(urllib.request.urlopen(f'http://{h}:{os.environ.get(\"PNU_PORT\",\"8020\")}/v1/health',timeout=2)); required=[v.strip() for v in os.environ.get('PNU_HEALTH_REQUIRED_ALGORITHMS','tool,blood,hand').split(',') if v.strip()]; models=p.get('models',{}); raise SystemExit(0 if required and len(required)==len(set(required)) and set(required)<={'tool','blood','hand'} and all(isinstance(models.get(v),dict) and models[v].get('ready') is True for v in required) else 1)"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 180s

