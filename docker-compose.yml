      source install/setup.bash &&
      exec python3 scripts/run_integration_debug.py
      --settings $${TASKPLANNER_DEBUG_NETWORK_SETTINGS}
      -- ros2 launch integration_debug taskplanner_debug.launch.py
      rosbridge_port:=$${ROSBRIDGE_DEBUG_PORT}
      rosbridge_address:=$${ROSBRIDGE_ADDRESS}
      rosbridge_service_timeout:=$${ROSBRIDGE_SERVICE_TIMEOUT}
      rosbridge_executable:=$${TASKPLANNER_DEBUG_ROSBRIDGE_EXECUTABLE}
      run_root:=$${TASKPLANNER_RUN_ROOT}"

  webapp-lan-proxy:
    # This service has no profile on purpose: starting `webapp` directly must
    # also expose the dashboard on the reviewed wired-LAN address. Keeping the
    # proxy separate from Debug/Replay prevents mode transitions from dropping
    # existing LAN browser sessions while Vite remains loopback-only.
    image: taskplanner-ws:dev
    restart: unless-stopped
    user: "${TASKPLANNER_UID:-1000}:${TASKPLANNER_GID:-1000}"
    working_dir: /workspaces/taskplanner_ws
    network_mode: host
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - .:/workspaces/taskplanner_ws:ro
    command:
      - python3
      - scripts/taskplanner_debug_lan_proxy.py
      - --bind-address
      - ${TASKPLANNER_WEBAPP_LAN_ADDRESS:-192.168.1.4}
      - --allow-network
      - ${TASKPLANNER_WEBAPP_LAN_NETWORK:-192.168.1.0/24}
      - --route
      - ${WEBAPP_PORT:-4173}=127.0.0.1:${WEBAPP_PORT:-4173}

  integration-debug-lan-proxy:
    profiles:
      # This is the LAN path router for the shared browser surface. It is
      # independent from the integration-debug runtime, so LLM Surgeon keeps
      # the router even though it does not start the Debug observer.
      - live
      - llm-surgeon
      - debug
      - replay
    image: taskplanner-ws:dev
    restart: unless-stopped
    user: "${TASKPLANNER_UID:-1000}:${TASKPLANNER_GID:-1000}"
    working_dir: /workspaces/taskplanner_ws
    network_mode: host
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - .:/workspaces/taskplanner_ws:ro
    command:
      - python3
      - scripts/taskplanner_debug_lan_proxy.py
      - --interface
      - ${TASKPLANNER_DEBUG_NETWORK_INTERFACE:-enp13s0}
      - --route
      - ${ROSBRIDGE_DEBUG_PORT:-9091}=127.0.0.1:${ROSBRIDGE_DEBUG_PORT:-9091}

  public-rosbridge-lan-proxy:
    profiles:
      - live
      - llm-surgeon
      - replay
    image: taskplanner-ws:dev
    restart: unless-stopped
    user: "${TASKPLANNER_UID:-1000}:${TASKPLANNER_GID:-1000}"
    working_dir: /workspaces/taskplanner_ws
    network_mode: host
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - .:/workspaces/taskplanner_ws:ro
    command:
      - python3
      - scripts/taskplanner_debug_lan_proxy.py
      - --interface
      - ${TASKPLANNER_DEBUG_NETWORK_INTERFACE:-enp13s0}
      - --route
      - ${PUBLIC_ROSBRIDGE_PORT:-9092}=127.0.0.1:${PUBLIC_ROSBRIDGE_PORT:-9092}

  integration-debug-tailscale-proxy:
    profiles:
      - live
      - llm-surgeon
      - replay
      - debug
    image: taskplanner-ws:dev
    restart: unless-stopped
    user: "${TASKPLANNER_UID:-1000}:${TASKPLANNER_GID:-1000}"
    working_dir: /workspaces/taskplanner_ws
    network_mode: host
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - .:/workspaces/taskplanner_ws:ro
    command:
      - python3
      - scripts/taskplanner_debug_lan_proxy.py
      # Tailscale's localhost gateway DNATs permitted Tailnet TCP to 127.0.0.1.
      # Route that single port by websocket path without opening a new port.
      - --bind-address
      - 127.0.0.1
      - --allow-network
      - 100.64.0.0/10
      - --allow-loopback-clients
      - --route
      - ${ROSBRIDGE_DEBUG_PORT:-9091}=127.0.0.1:${ROSBRIDGE_DEBUG_UPSTREAM_PORT:-9093}
      # The existing Tailnet-permitted port carries each reviewed runtime only
      # on an explicit websocket path. Root traffic remains Debug Mode.
      - --route
      - ${ROSBRIDGE_DEBUG_PORT:-9091}/live=127.0.0.1:${ROSBRIDGE_PORT:-9090}
      - --route
      - ${ROSBRIDGE_DEBUG_PORT:-9091}/llm=127.0.0.1:${ROSBRIDGE_PORT:-9090}
      - --route
      - ${ROSBRIDGE_DEBUG_PORT:-9091}/shadow=127.0.0.1:${ROSBRIDGE_SHADOW_PORT:-9099}
      - --route
      - ${ROSBRIDGE_DEBUG_PORT:-9091}/multicam=127.0.0.1:${ROSBRIDGE_MULTICAM_PORT:-9094}

  webapp:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        btops_ws: ${BTOPS_LOCAL_CONTEXT:-../btops_ws}
      args:
        BTOPS_LOCAL_CONTEXT: ${BTOPS_LOCAL_CONTEXT:-../btops_ws}
        BTOPS_REF: ${BTOPS_REF:-main}
        AUTO_APMS_REPO_URL: ${AUTO_APMS_REPO_URL:-https://github.com/AutoAPMS/auto-apms.git}
        AUTO_APMS_REF: ${AUTO_APMS_REF:-19ac8d558e35f657b8464694c5ddc524c6c31861}
        TASKPLANNER_BUILD_VERSION: ${TASKPLANNER_BUILD_VERSION:-0.1.0-dev}
        TASKPLANNER_BUILD_SHA: ${TASKPLANNER_BUILD_SHA:-unknown}
        TASKPLANNER_SHADOW_CONTRACT_VERSION: ${TASKPLANNER_SHADOW_CONTRACT_VERSION:-shadow-rfdetr-preflight-v1}
    image: taskplanner-ws:dev
    # The dashboard is the reviewed mode-transition surface. Keep it available
    # when Vite exits, while explicit `docker compose stop` still stays stopped.
    restart: unless-stopped
    working_dir: /workspaces/taskplanner_ws/webapp
    # The Vite server stays loopback-only on the host. Host networking lets its
    # server-side proxy reach the loopback-only runtime-control service without
    # opening that control service on a Docker or Tailnet interface.
    network_mode: host
    depends_on:
      webapp-lan-proxy:
        condition: service_started
    volumes:
      - .:/workspaces/taskplanner_ws
      - taskplanner_web_node_modules:/workspaces/taskplanner_ws/webapp/node_modules
      - ${TASKPLANNER_RUNTIME_CONTROL_TOKEN_FILE:-${HOME}/.config/taskplanner/secrets/runtime-control-token}:/run/taskplanner-secrets/runtime-control-token:ro
    environment:
      TASKPLANNER_RUNTIME_CONTROL_URL: http://127.0.0.1:${TASKPLANNER_RUNTIME_CONTROL_PORT:-8150}
      TASKPLANNER_RUNTIME_CONTROL_TOKEN_FILE: /run/taskplanner-secrets/runtime-control-token
      VITE_ROSBRIDGE_URL: ${VITE_ROSBRIDGE_URL:-}
      VITE_ROSBRIDGE_PORT: ${ROSBRIDGE_PORT:-9090}
      # Runtime status is authoritative. Keep this fallback mode-independent so
      # switching ROS profiles does not restart the dashboard that requested it.
      # A browser with no authoritative status begins on the real external
      # integration surface, not the synthetic LLM demonstration.
      VITE_DEFAULT_RUNTIME_MODE: ${TASKPLANNER_WEBAPP_FALLBACK_MODE:-live}
      VITE_ROSBRIDGE_LIVE_URL: ${VITE_ROSBRIDGE_LIVE_URL:-}
      VITE_ROSBRIDGE_LIVE_PORT: ${ROSBRIDGE_LIVE_PORT:-9090}
      VITE_ROSBRIDGE_LIVE_TAILSCALE_PORT: ${VITE_ROSBRIDGE_LIVE_TAILSCALE_PORT:-9091}
      VITE_ROSBRIDGE_LIVE_TAILSCALE_PATH: ${VITE_ROSBRIDGE_LIVE_TAILSCALE_PATH:-/live}
      VITE_ROSBRIDGE_TAILSCALE_PORT: ${VITE_ROSBRIDGE_TAILSCALE_PORT:-9091}
      VITE_ROSBRIDGE_LLM_TAILSCALE_PATH: ${VITE_ROSBRIDGE_LLM_TAILSCALE_PATH:-/llm}
      VITE_ROSBRIDGE_SHADOW_TAILSCALE_PATH: ${VITE_ROSBRIDGE_SHADOW_TAILSCALE_PATH:-/shadow}
      VITE_ROSBRIDGE_LLM_URL: ${VITE_ROSBRIDGE_LLM_URL:-}
      VITE_ROSBRIDGE_LLM_PORT: ${ROSBRIDGE_LLM_PORT:-9090}
      VITE_ROSBRIDGE_SHADOW_URL: ${VITE_ROSBRIDGE_SHADOW_URL:-}
      VITE_ROSBRIDGE_SHADOW_PORT: ${ROSBRIDGE_SHADOW_PORT:-9099}
      VITE_ROSBRIDGE_DEBUG_URL: ${VITE_ROSBRIDGE_DEBUG_URL:-}
      VITE_ROSBRIDGE_DEBUG_PORT: ${ROSBRIDGE_DEBUG_PORT:-9091}
      VITE_EXTERNAL_CAM1_TOPIC: ${VITE_EXTERNAL_CAM1_TOPIC:-/preview/cam_1/color/image_raw/compressed}
      VITE_EXTERNAL_CAM2_TOPIC: ${VITE_EXTERNAL_CAM2_TOPIC:-/preview/cam_2/color/image_raw/compressed}
      VITE_EXTERNAL_CAM3_TOPIC: ${VITE_EXTERNAL_CAM3_TOPIC:-/preview/cam_3/color/image_raw/compressed}
      VITE_EXTERNAL_CAM4_TOPIC: ${VITE_EXTERNAL_CAM4_TOPIC:-/preview/cam_4/color/image_raw/compressed}
      VITE_EXTERNAL_FLIR_TOPIC: ${VITE_EXTERNAL_FLIR_TOPIC:-/preview/flir/color/image_raw/compressed}
      WEBAPP_INSTALL_ON_START: ${WEBAPP_INSTALL_ON_START:-false}
    healthcheck:
      # Verify the fixed port, critical Vite transforms, and authenticated
      # host-control proxy. This is read-only and never invokes a transition.
      test:
        - CMD
        - python3
        - -c
        - >-
          import json,urllib.request;
          ui=[urllib.request.urlopen('http://127.0.0.1:4173'+path,timeout=2) for path in ('/','/src/App.tsx','/src/hooks/useRosBridge.ts')];
          ui_bodies=[response.read(524289) for response in ui];
          runtime=urllib.request.urlopen('http://127.0.0.1:4173/api/runtime/status',timeout=2);
          runtime_body=runtime.read(131073);
          state=json.loads(runtime_body.decode('utf-8'));
          modes={'live','llm-surgeon','replay','debug'};
          valid_ui=all(response.status == 200 for response in ui) and [response.headers.get_content_type() for response in ui] == ['text/html','text/javascript','text/javascript'] and all(0 < len(body) <= 524288 for body in ui_bodies) and b'id="root"' in ui_bodies[0];
          valid_state=runtime.status == 200 and runtime.headers.get_content_type() == 'application/json' and 0 < len(runtime_body) <= 131072 and isinstance(state,dict) and {'phase','active_mode','requested_mode','retryable'} <= state.keys() and state.get('phase') in {'idle','starting','failed'} and (state.get('active_mode') is None or state.get('active_mode') in modes) and (state.get('requested_mode') is None or state.get('requested_mode') in modes) and type(state.get('retryable')) is bool and (state.get('message') is None or isinstance(state.get('message'),str) and len(state.get('message')) <= 4096);
          raise SystemExit(0 if valid_ui and valid_state else 1)
      interval: 5s
      start_interval: 1s
      timeout: 3s
      retries: 12
      start_period: 10s
    command: >
      bash -lc "
        if [ \"$${WEBAPP_INSTALL_ON_START:-false}\" = 'true' ]; then
          npm install;
        elif [ ! -x node_modules/.bin/vite ]; then
          echo 'webapp node_modules is missing; rerun launcher with --build' >&2;
          exit 2;
        fi &&
        npm run dev -- --host 127.0.0.1 --port ${WEBAPP_PORT:-4173}
      "

volumes:
  taskplanner_web_node_modules:
